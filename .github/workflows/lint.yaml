name: Lint

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]
  # Allows a manual lint run against any branch.
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install argo CLI
        run: |
          ARGO_VERSION="v4.1.3"
          ARGO_SHA256="f3cf6ae424e9d2b3139efd29f673e7efc47a68881352a26a4122f72c4fc0efd4"
          curl -sSfL -o argo-linux-amd64.gz "https://github.com/argoproj/argo-workflows/releases/download/${ARGO_VERSION}/argo-linux-amd64.gz"
          echo "${ARGO_SHA256}  argo-linux-amd64.gz" | sha256sum -c -
          gunzip argo-linux-amd64.gz
          chmod +x argo-linux-amd64
          sudo mv argo-linux-amd64 /usr/local/bin/argo

      - name: Install actionlint
        run: |
          ACTIONLINT_VERSION="1.7.12"
          ACTIONLINT_SHA256="8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
          curl -sSfL -o actionlint.tar.gz "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          sudo mv actionlint /usr/local/bin/
          rm -f actionlint.tar.gz

      - name: Lint GitHub Actions workflows
        run: actionlint

      - name: Lint workflow-templates (offline, cross-file refs)
        run: argo lint --offline argo/workflow-templates/

      - name: Lint bootstrap templates (offline)
        run: argo lint --offline argo/bootstrap/

      - name: Lint standalone submit Workflows (offline, strict)
        run: |
          FAIL=0
          for f in argo/*.yaml; do
            # Files that reference WorkflowTemplates cannot be linted offline because
            # the referenced templates are not loaded. Lint them as advisory only;
            # every standalone file that embeds its own templates must pass offline.
            # Anchor to the start of a YAML key so comments/template names do not
            # accidentally mark a self-contained workflow as advisory.
            if grep -qE '^[[:space:]]*(workflowTemplateRef|templateRef):' "$f"; then
              echo "Advisory lint (server-side refs): $f"
              argo lint --offline "$f" || echo "WARNING: $f needs server-side template resolution"
            else
              echo "Strict lint: $f"
              argo lint --offline "$f" || FAIL=1
            fi
          done
          exit "$FAIL"
      - name: Registry allowlist check
        run: |
          # Fail if any image: reference uses a registry not in the cluster cache.
          # Add '# registry-lint-ignore' to a line to exempt it (e.g. ROCm device plugin).
          FAIL=0
          while IFS= read -r line; do
            echo "$line" | grep -q 'registry-lint-ignore' && continue
            imgref=$(echo "$line" | sed 's/.*image:[[:space:]]*//' | awk '{print $1}' | tr -d "\"'")
            [[ -z "$imgref" || "${imgref:0:1}" == "#" ]] && continue
            # Skip Argo parameter interpolations; the real registry is resolved at runtime.
            [[ "$imgref" == *'{{'* || "$imgref" == *'}}'* ]] && continue
            registry=$(echo "$imgref" | cut -d/ -f1)
            # skip bare names (no dot or colon = implicit docker.io, handled by zot-docker)
            echo "$registry" | grep -qE '[.:]' || continue
            case "$registry" in
              ghcr.io|quay.io|registry.fedoraproject.org|registry.k8s.io|cgr.dev|lscr.io|192.168.1.102|192.168.1.102:30500|192.168.1.102:30501|localhost) ;;
              *) echo "FAIL: uncached registry '$registry' in $(echo "$line" | cut -d: -f1-2): $imgref"; FAIL=1 ;;
            esac
          done < <(grep -rn 'image:' argo/ manifests/)
          exit "$FAIL"

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'

      - name: Semaphore topology check
        run: |
          pip install --quiet pyyaml
          python scripts/check_semaphore_topology.py argo/

      - name: Validate Python syntax
        run: |
          echo "Checking Python syntax..."
          find tests/ -name '*.py' -print0 | xargs -0 python -m py_compile

      - name: Check pytest collection
        run: |
          echo "Checking pytest imports and collection..."
          python -m pip install pytest -q
          python -m pytest tests/ --collect-only -q 2>&1 | tail -5
