apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: kde-linux-qa-
  namespace: argo
spec:
  entrypoint: pipeline
  serviceAccountName: argo
  activeDeadlineSeconds: 5400
  onExit: cleanup
  arguments:
    parameters:
    - name: image-url
      value: "https://files.kde.org/kde-linux/kde-linux_202609090254.iso"
    - name: image-sha256
      value: "4acbcf524ae780f97a70f9234194b6dc6dc344cd02e7f7ba98828223cee1de42"
    - name: namespace
      value: "aurora-test"
    - name: branch
      value: "main"
    # KDE Linux live image uses 'live' as the autologin user.
    # The SSH key is injected via accessCredentials/qemuGuestAgent, not cloud-init.
    - name: ssh-user
      value: "live"
    - name: ssh-pubkey-secret
      value: "bluefin-test-ssh-pubkey"
    - name: ssh-key-secret
      value: "bluefin-test-ssh-key"
  templates:
  - name: pipeline
    dag:
      tasks:
      - name: provision
        templateRef:
          name: provision-kde-linux-vm
          template: provision-vm
        arguments:
          parameters:
          - name: vm-name
            value: "kde-linux-{{workflow.uid}}"
          - name: namespace
            value: "{{workflow.parameters.namespace}}"
          - name: image-url
            value: "{{workflow.parameters.image-url}}"
          - name: image-sha256
            value: "{{workflow.parameters.image-sha256}}"
          - name: ssh-pubkey-secret
            value: "{{workflow.parameters.ssh-pubkey-secret}}"
      - name: tests
        depends: provision.Succeeded
        templateRef:
          name: run-kde-tests
          template: run-kde-tests
        arguments:
          parameters:
          - name: vm-name
            value: "kde-linux-{{workflow.uid}}"
          - name: vm-namespace
            value: "{{workflow.parameters.namespace}}"
          - name: branch
            value: "{{workflow.parameters.branch}}"
          - name: ssh-user
            value: "{{workflow.parameters.ssh-user}}"
          - name: ssh-key-secret
            value: "{{workflow.parameters.ssh-key-secret}}"
  - name: cleanup
    steps:
    - - name: teardown
        templateRef:
          name: teardown-vm
          template: teardown-vm
        arguments:
          parameters:
          - name: vm-name
            value: "kde-linux-{{workflow.uid}}"
          - name: namespace
            value: "{{workflow.parameters.namespace}}"
