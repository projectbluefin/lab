apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: bluefin-server-build-pipeline
  namespace: argo
  annotations:
    description: |
      In-cluster BuildStream build pipeline for Bluefin Server (the lab).
      Builds oci/bluefin-server-image.bst -- the whole release set: OS DDI,
      UKIs, netboot ESP, USB installer, sysexts, signed SHA256SUMS -- with the
      fixed DEV keys from the bluefin-server-dev-boot-keys Secret, and pushes
      it to the local Zot registry (:30500) as bluefin-server-image:latest.
      Release keys never exist here; GitHub Actions builds and publishes
      releases from main. Submit with -p ref=<branch> to try a branch.
  labels:
    app.kubernetes.io/component: bluefin-server-build
    app.kubernetes.io/part-of: bluefin-test-suite
spec:
  serviceAccountName: argo
  activeDeadlineSeconds: 28800   # 8 hours for cold-cache OS builds + retries
  podGC:
    strategy: OnWorkflowSuccess
  ttlStrategy:
    secondsAfterCompletion: 86400   # keep successful workflows for 24h
    secondsAfterFailure: 604800     # keep failed workflows for 7d

  arguments:
    parameters:
      - name: repo
        value: "https://github.com/projectbluefin/server.git"
      - name: ref
        value: "main"
      - name: registry
        value: "192.168.1.102:30500"

  entrypoint: build
  metrics:
    prometheus:
      - name: lab_build_workflow_completed_total
        help: Completed lab build workflows by pipeline and status.
        labels:
          - key: pipeline
            value: bluefin-server
          - key: status
            value: "{{workflow.status}}"
        counter:
          value: "1"
      - name: lab_build_workflow_duration_seconds
        help: Lab build workflow duration in seconds by pipeline and status.
        labels:
          - key: pipeline
            value: bluefin-server
          - key: status
            value: "{{workflow.status}}"
        histogram:
          buckets: [300, 900, 1800, 3600, 7200, 14400, 28800, 43200, 86400]
          value: "{{workflow.duration}}"

  templates:

    - name: build
      inputs:
        parameters:
          - name: ref
            value: "{{workflow.parameters.ref}}"
          - name: repo
            value: "{{workflow.parameters.repo}}"
          - name: registry
            value: "{{workflow.parameters.registry}}"
      steps:
        - - name: detect-build-mode
            templateRef:
              name: bst-admission-gate
              template: detect-build-mode
        - - name: core
            template: build-core
            arguments:
              parameters:
                - name: ref
                  value: "{{inputs.parameters.ref}}"
                - name: repo
                  value: "{{inputs.parameters.repo}}"
                - name: registry
                  value: "{{inputs.parameters.registry}}"

    - name: build-warmup
      synchronization:
        semaphores:
          - configMapKeyRef:
              name: workflow-semaphores
              key: bst-cache-warm
      inputs:
        parameters:
          - name: ref
            value: "{{workflow.parameters.ref}}"
          - name: repo
            value: "{{workflow.parameters.repo}}"
          - name: registry
            value: "{{workflow.parameters.registry}}"
      steps:
        - - name: core
            template: build-core
            arguments:
              parameters:
                - name: ref
                  value: "{{inputs.parameters.ref}}"
                - name: repo
                  value: "{{inputs.parameters.repo}}"
                - name: registry
                  value: "{{inputs.parameters.registry}}"

    - name: build-core
      synchronization:
        semaphores:
          - configMapKeyRef:
              name: workflow-semaphores
              key: bst-build
      inputs:
        parameters:
          - name: ref
            value: "{{workflow.parameters.ref}}"
          - name: repo
            value: "{{workflow.parameters.repo}}"
          - name: registry
            value: "{{workflow.parameters.registry}}"
      dag:
        tasks:
          - name: detect-build-mode
            templateRef:
              name: bst-admission-gate
              template: detect-build-mode
          - name: build-image
            template: bst-build-re
            depends: detect-build-mode
            arguments:
              parameters:
                - name: element
                  value: "oci/bluefin-server-image.bst"
                - name: tag
                  value: "bluefin-server-image"
                - name: ref
                  value: "{{inputs.parameters.ref}}"
                - name: repo
                  value: "{{inputs.parameters.repo}}"
                - name: registry
                  value: "{{inputs.parameters.registry}}"
    - name: bst-build-re
      priorityClassName: bst-build
      activeDeadlineSeconds: 10800   # 3 hours per pod to avoid queue starvation and long tail failures
      retryStrategy:
        limit: "1"
        retryPolicy: "Always"
      inputs:
        parameters:
          - name: element
          - name: tag
          - name: ref
          - name: repo
          - name: registry
      volumes:
        - name: fuse
          hostPath:
            path: /dev/fuse
        - name: bst-cache
          ephemeral:
            volumeClaimTemplate:
              spec:
                accessModes: [ReadWriteOnce]
                storageClassName: local-path
                resources:
                  requests:
                    storage: 200Gi
        - name: buildstream-config
          configMap:
            name: buildstream-remote-cache
            items:
              - key: dakota-buildstream.conf
                path: buildstream.conf
              - key: remote-execution.conf
                path: remote-execution.conf
        # Fixed dev key set (Secret created out of band, see
        # docs/skills/bluefin-server/SKILL.md). Fixed, not per-run: the kernel's
        # cache key includes the module certificate, so a stable dev key keeps
        # the kernel and everything signed with it in the BuildBarn CAS.
        - name: dev-keys
          secret:
            secretName: bluefin-server-dev-boot-keys
      script:
        image: "{{inputs.parameters.registry}}/bst2:64eb0b4930d57a92710822898fb73af6cc1ae35d"
        command: [bash]
        securityContext:
          privileged: true
          seLinuxOptions:
            type: spc_t
        # Element builds run on the BuildGrid workers; this pod only
        # coordinates, fetches sources and exports the result.
        resources:
          requests:
            cpu: "2"
            memory: 4Gi
            ephemeral-storage: 10Gi
          limits:
            cpu: "4"
            memory: 8Gi
            ephemeral-storage: 50Gi
        env:
          - name: GITHUB_TOKEN
            valueFrom:
              secretKeyRef:
                name: github-token
                key: token
          - name: GRPC_POLL_STRATEGY
            value: poll
          - name: GRPC_ENABLE_FORK_SUPPORT
            value: "1"
          # Avoid the FUSE staging backend; BuildStream exits 255 in this lab
          # environment when the FUSE stager crashes during source staging.
          - name: BUILDBOX_STAGER
            value: copy-or-link
        volumeMounts:
          - name: fuse
            mountPath: /dev/fuse
          - name: bst-cache
            mountPath: /root/.cache/buildstream
          - name: buildstream-config
            mountPath: /etc/buildstream
            readOnly: true
          - name: dev-keys
            mountPath: /dev-keys
            readOnly: true
        source: |
          set -euo pipefail

          ELEMENT="{{inputs.parameters.element}}"
          TAG="{{inputs.parameters.tag}}"
          REF="{{inputs.parameters.ref}}"
          REPO="{{inputs.parameters.repo}}"

          echo "=== Cloning bluefin-server @ ${REF} ==="
          rm -rf /src
          git clone --depth=1 --branch "${REF}" "https://x-access-token:${GITHUB_TOKEN}@${REPO#https://}" /src
          cd /src
          # Lab builds are dev-key builds only; the images are never published.
          mkdir -p files/boot-keys
          tar -xzf /dev-keys/keys.tgz -C files/boot-keys
          echo "=== ${REF} @ $(git rev-parse HEAD), dev keys ==="
          PROJECT_NAME=$(awk -F': *' '/^name:/{print $2; exit}' project.conf | tr -d '\r')

          cp /etc/buildstream/buildstream.conf /tmp/buildstream-cluster.conf
          BST_CONF=/tmp/buildstream-cluster.conf
          cat >> /tmp/buildstream-cluster.conf <<EOF
          projects:
            ${PROJECT_NAME}:
              artifacts:
                override-project-caches: false
                servers:
                - url: grpc://frontend.buildbarn.svc.cluster.local:8980
                  push: true
                - url: https://gbm.gnome.org:11003
                  push: false
                - url: https://cache.projectbluefin.io:11001
                  push: false
              source-caches:
                # The deployed bb-remote-asset endpoint cannot FetchBlob/FetchDirectory
                # BuildStream URNs (it treats them as HTTP/URN and returns UNIMPLEMENTED /
                # PERMISSION_DENIED). Override junction source-cache entries so no
                # incompatible source-push server is inherited.
                override-project-caches: true
                servers:
                - url: https://gbm.gnome.org:11003
                  push: false
                - url: https://cache.projectbluefin.io:11001
                  push: false
          EOF

          echo "=== Distributed build: BuildGrid remote execution ==="
          sed 's/^/    /' /etc/buildstream/remote-execution.conf >> /tmp/buildstream-cluster.conf
          if ! grep -q '^        url: http://controller.buildgrid.svc.cluster.local:50051$' /tmp/buildstream-cluster.conf; then
            echo "BuildStream remote execution is not pointed at the BuildGrid controller" >&2
            exit 1
          fi

          echo "=== Building ${ELEMENT} through BuildGrid remote execution ==="
          bst --config "${BST_CONF}" \
              --no-interactive \
              build "${ELEMENT}"

          echo "=== Exporting ${ELEMENT} ==="
          EXPORT_DIR="/tmp/export-$(basename ${ELEMENT} .bst)"
          mkdir -p "${EXPORT_DIR}"
          bst --config "${BST_CONF}" \
              --no-interactive \
              artifact checkout "${ELEMENT}" \
              --directory "${EXPORT_DIR}"

          _PUSH_DEST="{{inputs.parameters.registry}}"
          registry_host="${_PUSH_DEST#*://}"
          registry_host="${registry_host%%/*}"
          registry_host="${registry_host%%:*}"
          registry_host="$(printf '%s' "${registry_host}" | tr '[:upper:]' '[:lower:]')"
          if [[ "${registry_host}" == "ghcr.io" || "${registry_host}" == *.ghcr.io ]]; then
            echo "ERROR: GHCR push destination is forbidden: ${_PUSH_DEST}" >&2
            exit 1
          fi

          echo "=== Pushing to local Zot ==="
          if [ -f "${EXPORT_DIR}/index.json" ] && [ -f "${EXPORT_DIR}/oci-layout" ]; then
            IMAGE_ID=$(podman pull "oci:${EXPORT_DIR}" | tail -1)
            podman push "${IMAGE_ID}" "docker://{{inputs.parameters.registry}}/${TAG}:latest" --tls-verify=false
            podman rmi "${IMAGE_ID}" 2>/dev/null || true
          else
            echo "Export is not an OCI layout — wrapping raw files in a scratch OCI image"
            cat <<EOF > "${EXPORT_DIR}/Containerfile"
          FROM scratch
          COPY . /
          EOF
            podman build --tls-verify=false -t "localhost/${TAG}:latest" -f "${EXPORT_DIR}/Containerfile" "${EXPORT_DIR}"
            podman push --tls-verify=false "localhost/${TAG}:latest" "docker://{{inputs.parameters.registry}}/${TAG}:latest"
            podman rmi "localhost/${TAG}:latest" 2>/dev/null || true
          fi

          echo "=== Build complete: {{inputs.parameters.registry}}/${TAG}:latest ==="
