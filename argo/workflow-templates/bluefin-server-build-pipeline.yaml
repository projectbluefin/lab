apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: bluefin-server-build-pipeline
  namespace: argo
  annotations:
    description: |
      In-cluster BuildStream build pipeline for Bluefin Server (the lab).
      Builds oci/bluefin-server-image.bst -- the whole release set: OS DDI,
      UKIs, netboot ESP, USB installer, sysexts, signed SHA256SUMS -- with the
      fixed DEV keys from the bluefin-server-dev-boot-keys Secret, and pushes
      it to the local Zot registry (:30500) as bluefin-server-image:latest.
      Release keys never exist here; GitHub Actions builds and publishes
      releases from main. Submit with -p ref=<branch> to try a branch.
  labels:
    app.kubernetes.io/component: bluefin-server-build
    app.kubernetes.io/part-of: bluefin-test-suite
spec:
  serviceAccountName: argo
  activeDeadlineSeconds: 28800   # 8 hours for cold-cache OS builds + retries
  # Keep pods (coordinator logs, bst-cache PVC) 2h after completion; see
  # dakota-build-pipeline.
  podGC:
    strategy: OnWorkflowCompletion
    deleteDelayDuration: 2h
  ttlStrategy:
    secondsAfterCompletion: 86400   # keep successful workflows for 24h
    secondsAfterFailure: 604800     # keep failed workflows for 7d

  arguments:
    parameters:
      - name: repo
        value: "https://github.com/projectbluefin/server.git"
      - name: ref
        value: "main"
      - name: registry
        value: "192.168.1.102:30500"

  entrypoint: build
  metrics:
    prometheus:
      - name: lab_build_workflow_completed_total
        help: Completed lab build workflows by pipeline and status.
        labels:
          - key: pipeline
            value: bluefin-server
          - key: status
            value: "{{workflow.status}}"
        counter:
          value: "1"
      - name: lab_build_workflow_duration_seconds
        help: Lab build workflow duration in seconds by pipeline and status.
        labels:
          - key: pipeline
            value: bluefin-server
          - key: status
            value: "{{workflow.status}}"
        histogram:
          buckets: [300, 900, 1800, 3600, 7200, 14400, 28800, 43200, 86400]
          value: "{{workflow.duration}}"

  templates:

    - name: build
      synchronization:
        semaphores:
          - configMapKeyRef:
              name: workflow-semaphores
              key: bst-build
      inputs:
        parameters:
          - name: ref
            value: "{{workflow.parameters.ref}}"
          - name: repo
            value: "{{workflow.parameters.repo}}"
          - name: registry
            value: "{{workflow.parameters.registry}}"
      dag:
        tasks:
          - name: detect-build-mode
            templateRef:
              name: bst-admission-gate
              template: detect-build-mode
          - name: build-image
            templateRef:
              name: bst-build-re
              template: build
            depends: detect-build-mode
            arguments:
              parameters:
                - name: element
                  value: "oci/bluefin-server-image.bst"
                - name: tag
                  value: "bluefin-server-image"
                - name: ref
                  value: "{{inputs.parameters.ref}}"
                - name: repo
                  value: "{{inputs.parameters.repo}}"
                - name: registry
                  value: "{{inputs.parameters.registry}}"
                - name: deadline
                  value: "10800"   # 3h per pod to avoid queue starvation and long tail failures
                - name: clone-token
                  value: "true"
                - name: dev-keys
                  value: "true"
                - name: upstream-cache
                  value: "https://cache.projectbluefin.io:11001"

    - name: build-warmup
      synchronization:
        semaphores:
          - configMapKeyRef:
              name: workflow-semaphores
              key: bst-cache-warm
      inputs:
        parameters:
          - name: ref
            value: "{{workflow.parameters.ref}}"
          - name: repo
            value: "{{workflow.parameters.repo}}"
          - name: registry
            value: "{{workflow.parameters.registry}}"
      steps:
        - - name: core
            template: build
            arguments:
              parameters:
                - name: ref
                  value: "{{inputs.parameters.ref}}"
                - name: repo
                  value: "{{inputs.parameters.repo}}"
                - name: registry
                  value: "{{inputs.parameters.registry}}"
