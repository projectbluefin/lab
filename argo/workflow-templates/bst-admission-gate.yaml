apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: bst-admission-gate
  namespace: argo
  annotations:
    description: |
      Shared USB4/BuildGrid admission gate for BuildStream lanes. Requires a
      fresh usb4-link=up observation and a Ready node and BuildGrid worker on
      both ghost and exo-0, plus a Ready BuildGrid controller. Workers on any
      additional node add capacity without changing this gate. Outputs mode=re.
  labels:
    app.kubernetes.io/component: bst-admission-gate
    app.kubernetes.io/part-of: bluefin-test-suite
spec:
  serviceAccountName: argo
  templates:
    - name: detect-build-mode
      outputs:
        parameters:
          - name: mode
            valueFrom:
              path: /tmp/mode
      script:
        image: ghcr.io/projectbluefin/lab-runner@sha256:767777acd14e340698f31992e6e2cc9bc1b2009ccb1472dfcfd9c7f6e9d60e29 # 26.08.2
        command: [bash]
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
        source: |
          set -euo pipefail

          MAX_AGE_SECONDS=60
          NOW="$(date -u +%s)"
          for NODE in ghost exo-0; do
            LINK="$(kubectl get node "${NODE}" -o jsonpath='{.metadata.labels.lab\.projectbluefin\.io/usb4-link}')"
            if [[ -z "${LINK}" ]]; then
              LINK="$(kubectl get node "${NODE}" -o jsonpath='{.metadata.annotations.lab\.projectbluefin\.io/usb4-link}')"
            fi
            OBSERVED_AT="$(kubectl get node "${NODE}" -o jsonpath='{.metadata.annotations.lab\.projectbluefin\.io/usb4-link-observed-at}')"
            READY="$(kubectl get node "${NODE}" -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}')"

            if [[ "${LINK}" != "up" || ! "${OBSERVED_AT}" =~ ^[0-9]+$ || "${READY}" != "True" ]]; then
              echo "USB4 BuildGrid gate rejected ${NODE}: link=${LINK:-missing} (label/annotation lab.projectbluefin.io/usb4-link) observed-at=${OBSERVED_AT:-missing} ready=${READY:-unknown}" >&2
              exit 1
            fi
            if (( NOW - OBSERVED_AT > MAX_AGE_SECONDS )); then
              echo "USB4 BuildGrid gate rejected ${NODE}: observation is stale ($((NOW - OBSERVED_AT))s old)" >&2
              exit 1
            fi
          done

          WORKERS="$(kubectl get pods -n buildgrid -l app=buildgrid-worker -o jsonpath='{range .items[*]}{.spec.nodeName}{"|"}{.status.phase}{"|ready="}{range .status.containerStatuses[?(@.name=="worker")]}{.ready}{end}{"\n"}{end}')"
          for NODE in ghost exo-0; do
            if ! grep -Eq "^${NODE}\|Running\|ready=true$" <<<"${WORKERS}"; then
              echo "USB4 BuildGrid gate rejected: no Ready BuildGrid worker on ${NODE}" >&2
              exit 1
            fi
          done
          CONTROLLER_READY="$(kubectl get deploy -n buildgrid controller -o jsonpath='{.status.readyReplicas}')"
          if [[ "${CONTROLLER_READY:-0}" -lt 1 ]]; then
            echo "USB4 BuildGrid gate rejected: BuildGrid controller is not Ready" >&2
            exit 1
          fi

          echo "USB4-backed BuildGrid remote execution admitted ($(grep -c 'ready=true$' <<<"${WORKERS}") workers)"
          printf '%s' re > /tmp/mode
