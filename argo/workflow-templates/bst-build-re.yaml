apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: bst-build-re
  namespace: argo
  annotations:
    description: |
      BuildStream coordinator pod shared by dakota-build-pipeline and
      bluefin-server-build-pipeline (templateRef bst-build-re/build). Builds
      one element through BuildGrid remote execution, checks its OCI layout
      out onto the pod's CAS volume, and publishes it to the local Zot
      registry as <tag>:<image-tag>. Callers hold the bst-build semaphore;
      it is not inherited from here.
  labels:
    app.kubernetes.io/component: bst-build-re
    app.kubernetes.io/part-of: bluefin-test-suite
spec:
  serviceAccountName: argo
  templates:
    - name: build
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - exo-0
        # At most one coordinator per node per workflow: the bst-build lane
        # sizing (workflow-semaphores, buildstream-remote-cache `builders`)
        # assumes two coordinators per pipeline.
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: workflows.argoproj.io/workflow
                    operator: In
                    values:
                      - "{{workflow.name}}"
              topologyKey: kubernetes.io/hostname
      priorityClassName: bst-build
      activeDeadlineSeconds: "{{inputs.parameters.deadline}}"
      # Secrets exist only in pods that use them. The coordinator runs
      # third-party build code (junction integration commands), so a Dakota
      # pod must not carry the GitHub token or the Bluefin Server boot keys.
      # Callers that need a Secret pass it in `pod-patch` (strategic-merge
      # patch; default `{}` adds nothing). Argo does not evaluate `{{= }}`
      # expressions here, so the patch arrives as a plain parameter.
      podSpecPatch: '{{inputs.parameters.pod-patch}}'
      # Retry once, except exit 3 from bst-build.sh: an element's own build
      # failed and its failed artifact is cached, so a retry would spend
      # ~20 minutes re-pulling ~900 artifacts to fail the same way. Grid,
      # CAS, network and pod failures still get the retry.
      retryStrategy:
        limit: "1"
        retryPolicy: "Always"
        expression: 'lastRetry.exitCode != "3"'
      inputs:
        parameters:
          - name: element
          - name: tag
          - name: ref
          - name: repo
          - name: registry
          # Exact commit to build; empty builds the head of `ref`.
          - name: commit-sha
            value: ""
          - name: image-tag
            value: "latest"
          - name: deadline
            value: "43200"
          # Strategic-merge pod patch. bluefin-server-build-pipeline uses it to
          # add the github-token env and the bluefin-server-dev-boot-keys
          # Secret mount; the build clones with GITHUB_TOKEN when it is set and
          # unpacks /dev-keys/keys.tgz when it exists.
          - name: pod-patch
            value: "{}"
          # Second read-only artifact/source cache for the toplevel project,
          # replacing the ConfigMap's cache.freedesktop-sdk.io there only (the
          # lab servers stay, push: true; last for sources, see the ConfigMap);
          # empty keeps the global servers for every project.
          - name: upstream-cache
            value: ""
      volumes:
        - name: fuse
          hostPath:
            path: /dev/fuse
        # Generic-ephemeral local-path PVC gives every pod and retry a clean,
        # dedicated 200Gi local CAS directory that is automatically reclaimed on
        # pod termination, preventing corrupted metadata from poisoning subsequent runs.
        - name: bst-cache
          ephemeral:
            volumeClaimTemplate:
              spec:
                accessModes: [ReadWriteOnce]
                storageClassName: local-path
                resources:
                  requests:
                    storage: 200Gi
        - name: buildstream-config
          configMap:
            name: buildstream-remote-cache
            items:
              - key: dakota-buildstream.conf
                path: buildstream.conf
              - key: remote-execution.conf
                path: remote-execution.conf
              - key: bst-build.sh
                path: bst-build.sh
      # One pod, two containers sharing the per-pod CAS PVC: `main` (bst2)
      # builds and checks the OCI layout out onto the PVC, then `publish`
      # (distroless fsdk-containers skopeo) copies it straight to Zot. bst2
      # ships podman but no skopeo, and the podman pull-into-storage + push
      # round trip cost ~2 minutes per variant.
      containerSet:
        volumeMounts:
          - name: bst-cache
            mountPath: /root/.cache/buildstream
        containers:
          - name: main
            image: "{{inputs.parameters.registry}}/bst2:64eb0b4930d57a92710822898fb73af6cc1ae35d"
            command: [bash, -c]
            securityContext:
              privileged: true
              seLinuxOptions:
                type: spc_t
            env:
              # BuildStream 2 runs jobs in threads and forks plugin helpers
              # from a forkserver, so it needs no GRPC_POLL_STRATEGY=poll.
              - name: GRPC_ENABLE_FORK_SUPPORT
                value: "1"
              # The BuildStream image used by this workflow only accepts the
              # `fuse` and `copy-or-link` staging backends. The unsupported
              # `copy` backend crashes immediately with a buildbox-casd startup
              # error, so use `copy-or-link` here.
              - name: BUILDBOX_STAGER
                value: copy-or-link
              - name: XDG_CACHE_HOME
                value: "/root/.cache"
            # Element builds run on the BuildGrid workers; this container only
            # coordinates, fetches sources and exports the result.
            resources:
              requests:
                cpu: "2"
                memory: 4Gi
                ephemeral-storage: 10Gi
              limits:
                cpu: "4"
                memory: 8Gi
                ephemeral-storage: 50Gi
            volumeMounts:
              - name: fuse
                mountPath: /dev/fuse
              - name: buildstream-config
                mountPath: /etc/buildstream
                readOnly: true
            args:
              - |
                set -euo pipefail

                cp /etc/buildstream/buildstream.conf /tmp/buildstream-cluster.conf
                BST_CONF=/tmp/buildstream-cluster.conf
                ELEMENT="{{inputs.parameters.element}}"
                TAG="{{inputs.parameters.tag}}"
                REF="{{inputs.parameters.ref}}"
                REPO="{{inputs.parameters.repo}}"
                COMMIT_SHA="{{inputs.parameters.commit-sha}}"
                UPSTREAM_CACHE="{{inputs.parameters.upstream-cache}}"

                # Fail before building if the publish container would push to GHCR.
                _PUSH_DEST="{{inputs.parameters.registry}}"
                registry_host="${_PUSH_DEST#*://}"
                registry_host="${registry_host%%/*}"
                registry_host="${registry_host%%:*}"
                registry_host="$(printf '%s' "${registry_host}" | tr '[:upper:]' '[:lower:]')"
                if [[ "${registry_host}" == "ghcr.io" || "${registry_host}" == *.ghcr.io ]]; then
                  echo "ERROR: GHCR push destination is forbidden: ${_PUSH_DEST}" >&2
                  exit 1
                fi

                mkdir -p "${XDG_CACHE_HOME}"
                # Retries can leave stale dulwich lock files; clear them before fetch.
                find "${XDG_CACHE_HOME}/buildstream/sources/git_repo" -type f -name '*.lock' -delete 2>/dev/null || true
                echo "=== Cloning ${REPO} @ ${REF} ==="
                if [[ -n "${GITHUB_TOKEN:-}" ]]; then
                  REPO="https://x-access-token:${GITHUB_TOKEN}@${REPO#https://}"
                fi
                rm -rf /src
                git clone --depth=1 "${REPO}" /src
                cd /src
                if [[ -n "${COMMIT_SHA}" ]]; then
                  echo "=== Checking out exact GitHub commit ${COMMIT_SHA} ==="
                  git fetch --depth=1 origin "${COMMIT_SHA}"
                  git checkout --detach "${COMMIT_SHA}"
                else
                  echo "=== Checking out ref ${REF} ==="
                  git fetch --depth=1 origin "${REF}"
                  git checkout --detach FETCH_HEAD
                fi
                if [[ -f /dev-keys/keys.tgz ]]; then
                  # Lab builds are dev-key builds only; the images are never published.
                  mkdir -p files/boot-keys
                  tar -xzf /dev-keys/keys.tgz -C files/boot-keys
                  echo "=== $(git rev-parse HEAD), dev keys ==="
                fi

                # Artifact/source cache servers are global in the ConfigMap so the
                # gnome-build-meta and freedesktop-sdk junction projects use the lab
                # cache too; only remote execution is per (toplevel) project.
                PROJECT_NAME=$(awk -F': *' '/^name:/{print $2; exit}' project.conf | tr -d '\r')
                printf 'projects:\n  %s:\n' "${PROJECT_NAME}" >> "${BST_CONF}"
                if [[ -n "${UPSTREAM_CACHE}" ]]; then
                  cat >> "${BST_CONF}" <<EOF
                    artifacts:
                      override-project-caches: false
                      servers:
                      - url: grpc://bb-remote-asset.buildbarn.svc.cluster.local:8984
                        type: index
                        push: true
                      - url: grpc://frontend.buildbarn.svc.cluster.local:8980
                        type: storage
                        push: true
                      - url: https://gbm.gnome.org:11003
                        push: false
                      - url: ${UPSTREAM_CACHE}
                        push: false
                    source-caches:
                      override-project-caches: true
                      servers:
                      - url: https://gbm.gnome.org:11003
                        push: false
                      - url: ${UPSTREAM_CACHE}
                        push: false
                      - url: grpc://bb-remote-asset.buildbarn.svc.cluster.local:8984
                        type: index
                        push: true
                      - url: grpc://frontend.buildbarn.svc.cluster.local:8980
                        type: storage
                        push: true
                EOF
                fi

                echo "=== Distributed build: BuildGrid remote execution ==="
                sed 's/^/    /' /etc/buildstream/remote-execution.conf >> "${BST_CONF}"
                if ! grep -q '^        url: http://controller.buildgrid.svc.cluster.local:50051$' "${BST_CONF}"; then
                  echo "BuildStream remote execution is not pointed at the BuildGrid controller" >&2
                  exit 1
                fi
                echo "=== Verified BuildStream remote execution configuration ==="

                # Gaming lanes are the same elements with the `gaming` project
                # option enabled (dakota project.conf; CI: BUILD_GAMING=true).
                # Derive from the image tag to keep template plumbing unchanged.
                GAMING_FLAG=()
                case "${TAG}" in
                  *gaming*) GAMING_FLAG=(-o gaming true) ;;
                esac

                echo "=== Building ${ELEMENT} through BuildGrid remote execution ==="
                # The failed element's log is the only copy of a remote build's
                # output in the pod log. At the default 20 lines a -j32 kernel
                # build shows only trailing warnings, not the error.
                # bst-build.sh exits 3 for a cached element build failure, which
                # retryStrategy does not retry.
                bash /etc/buildstream/bst-build.sh \
                    --config "${BST_CONF}" \
                    --no-interactive \
                    --error-lines 2000 \
                    --fetchers 8 \
                    "${GAMING_FLAG[@]}" \
                    build "${ELEMENT}"

                # `bst artifact checkout` resolves by cache key, and every -o option
                # is part of that key. The build above runs with the project defaults
                # (dakota pins x86_64_v3 false, as its Justfile and CI require), so
                # checking out with `-o x86_64_v3 true` asks for a *different*
                # artifact than the one just built - stale content at best, a cache
                # miss at worst. Keep both invocations on the same options.
                # The publish container reads OCI_DIR from the shared bst-cache
                # volume after this container exits 0.
                echo "=== Exporting ${ELEMENT} ==="
                OCI_DIR="${XDG_CACHE_HOME}/buildstream/oci-export"
                RAW_DIR="${XDG_CACHE_HOME}/buildstream/raw-export"
                rm -rf "${OCI_DIR}" "${RAW_DIR}"
                mkdir -p "${RAW_DIR}"
                bst --config "${BST_CONF}" \
                    --no-interactive \
                    --fetchers 8 \
                    "${GAMING_FLAG[@]}" \
                    artifact checkout "${ELEMENT}" \
                    --directory "${RAW_DIR}"

                if [ -f "${RAW_DIR}/index.json" ] && [ -f "${RAW_DIR}/oci-layout" ]; then
                  mv "${RAW_DIR}" "${OCI_DIR}"
                else
                  echo "Export is not an OCI layout — wrapping raw files in a scratch OCI image"
                  cat <<EOF > "${RAW_DIR}/Containerfile"
                FROM scratch
                COPY . /
                EOF
                  podman build --tls-verify=false -t "localhost/${TAG}:latest" -f "${RAW_DIR}/Containerfile" "${RAW_DIR}"
                  podman push "localhost/${TAG}:latest" "oci:${OCI_DIR}"
                  podman rmi "localhost/${TAG}:latest" 2>/dev/null || true
                  rm -rf "${RAW_DIR}"
                fi
                echo "=== OCI layout ready for publish ==="
          - name: publish
            dependencies: [main]
            image: ghcr.io/projectbluefin/skopeo@sha256:2e83b66c8ee7d045cb4ba9dacaea2c3a5d9d7a5d8daefd81b895b84f1cfa3258 # 26.08.2
            command: [skopeo]
            # The lab Zot NodePort (192.168.1.102:30500) is a node IP, which
            # routes over 2.5GbE. Its in-cluster Service is pod-to-pod, which
            # rides the USB4 link. kubelet image refs keep using the NodePort.
            args:
              - copy
              - --dest-tls-verify=false
              - oci:/root/.cache/buildstream/oci-export
              - "docker://{{=inputs.parameters.registry == '192.168.1.102:30500' ? 'registry.local-registry.svc.cluster.local:5000' : inputs.parameters.registry}}/{{inputs.parameters.tag}}:{{inputs.parameters.image-tag}}"
            # skopeo compresses the uncompressed export with parallel gzip; a
            # 1-CPU limit made publish compression-bound (~60s per variant).
            resources:
              requests:
                cpu: "1"
                memory: 256Mi
                ephemeral-storage: 1Gi
              limits:
                cpu: "16"
                memory: 2Gi
                ephemeral-storage: 5Gi
