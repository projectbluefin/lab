apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: dakota-build-pipeline
  namespace: argo
  annotations:
    description: |
      Dakota BST build pipeline. Builds the default bluefin OCI variant and
      the NVIDIA/gaming variants of the exact dakota commit, unmodified.
      Every element build is a BuildGrid remote-execution action that runs
      in a buildbox-run-bubblewrap sandbox on whichever worker node takes it;
      CAS and artifacts live in the shared Buildbarn storage.
      Triggered by push to dakota:testing via the shared bst-commit-poller template.
      On success, exports to local Zot (:30500) as dakota:<image-tag> and
      dakota-nvidia:<image-tag> (default "testing").
      NVIDIA builds run with continueOn (non-blocking) as the lab does not have GPU
      hardware to test NVIDIA runtime execution.
      Uses bst-build PriorityClass.
  labels:
    app.kubernetes.io/component: dakota-build
    app.kubernetes.io/part-of: bluefin-test-suite
spec:
  serviceAccountName: argo
  # Pipelines are admitted through the cluster-wide bst-build semaphore lanes
  # (manifests/workflow-semaphores.yaml); the variant drivers inside each
  # pipeline remain parallel.
  # Cold bootstrap + source fetch + package compilation can exceed the prior 6h
  # per-pod deadline, so allow a full 12h per build pod and a 24h workflow
  # ceiling to cover one complete build/export path without killing it mid-run.
  activeDeadlineSeconds: 86400
  # The coordinator pod log is the only copy of a build's phase timings and of
  # a failed remote action's output, and the template has no log archive.
  # Keep every pod (and its bst-cache PVC, ~25Gi used) for 2h after the
  # workflow ends, success or failure, then let Argo delete it.
  podGC:
    strategy: OnWorkflowCompletion
    deleteDelayDuration: 2h

  arguments:
    parameters:
      - name: repo
        value: "https://github.com/projectbluefin/dakota.git"
      - name: ref
        value: "testing"
      - name: commit-sha
        value: ""
      - name: image-tag
        value: "testing"
      - name: registry
        value: "192.168.1.102:30500"
      # "all" keeps the full matrix. "default" builds only oci/bluefin.bst,
      # which is what a single-machine rebase needs: the four-variant fan-out
      # cannot schedule on a two-node grid (pod anti-affinity leaves retries
      # Unschedulable: "0/2 nodes are available: 2 node(s) didn't match pod
      # anti-affinity rules") and the extra variants are wasted work there.
      - name: variants
        value: "all"

  entrypoint: build
  metrics:
    prometheus:
      - name: lab_build_workflow_completed_total
        help: Completed lab build workflows by pipeline and status.
        labels:
          - key: pipeline
            value: dakota
          - key: status
            value: "{{workflow.status}}"
        counter:
          value: "1"
      - name: lab_build_workflow_duration_seconds
        help: Lab build workflow duration in seconds by pipeline and status.
        labels:
          - key: pipeline
            value: dakota
          - key: status
            value: "{{workflow.status}}"
        histogram:
          buckets: [300, 900, 1800, 3600, 7200, 14400, 28800, 43200, 86400]
          value: "{{workflow.duration}}"
  
  templates:

    - name: build
      inputs:
        parameters:
          - name: ref
            value: "{{workflow.parameters.ref}}"
          - name: commit-sha
            value: "{{workflow.parameters.commit-sha}}"
          - name: image-tag
            value: "{{workflow.parameters.image-tag}}"
          - name: repo
            value: "{{workflow.parameters.repo}}"
          - name: registry
            value: "{{workflow.parameters.registry}}"
          # Callers that reach this template through templateRef (bst-commit-poller,
          # bst-cache-warm) declare no `variants` workflow parameter, so it has
          # to arrive as an input with a default rather than be read from
          # workflow scope.
          - name: variants
            value: "all"
      synchronization:
        semaphores:
          - configMapKeyRef:
              name: workflow-semaphores
              key: bst-build
      steps:
        - - name: core
            template: build-core
            arguments:
              parameters:
                - name: ref
                  value: "{{inputs.parameters.ref}}"
                - name: commit-sha
                  value: "{{inputs.parameters.commit-sha}}"
                - name: image-tag
                  value: "{{inputs.parameters.image-tag}}"
                - name: repo
                  value: "{{inputs.parameters.repo}}"
                - name: registry
                  value: "{{inputs.parameters.registry}}"
                - name: variants
                  value: "{{inputs.parameters.variants}}"

    - name: build-warmup
      synchronization:
        semaphores:
          - configMapKeyRef:
              name: workflow-semaphores
              key: bst-cache-warm
      inputs:
        parameters:
          - name: ref
            value: "{{workflow.parameters.ref}}"
          - name: commit-sha
            value: "{{workflow.parameters.commit-sha}}"
          - name: image-tag
            value: "{{workflow.parameters.image-tag}}"
          - name: repo
            value: "{{workflow.parameters.repo}}"
          - name: registry
            value: "{{workflow.parameters.registry}}"
          # Callers that reach this template through templateRef (bst-commit-poller,
          # bst-cache-warm) declare no `variants` workflow parameter, so it has
          # to arrive as an input with a default rather than be read from
          # workflow scope.
          - name: variants
            value: "all"
      steps:
        - - name: core
            template: build-core
            arguments:
              parameters:
                - name: ref
                  value: "{{inputs.parameters.ref}}"
                - name: commit-sha
                  value: "{{inputs.parameters.commit-sha}}"
                - name: image-tag
                  value: "{{inputs.parameters.image-tag}}"
                - name: repo
                  value: "{{inputs.parameters.repo}}"
                - name: registry
                  value: "{{inputs.parameters.registry}}"
                - name: variants
                  value: "{{inputs.parameters.variants}}"

    - name: build-core
      inputs:
        parameters:
          - name: ref
            value: "{{workflow.parameters.ref}}"
          - name: commit-sha
            value: "{{workflow.parameters.commit-sha}}"
          - name: image-tag
            value: "{{workflow.parameters.image-tag}}"
          - name: repo
            value: "{{workflow.parameters.repo}}"
          - name: registry
            value: "{{workflow.parameters.registry}}"
          - name: variants
            value: "all"
      dag:
        tasks:
          - name: detect-build-mode
            templateRef:
              name: bst-admission-gate
              template: detect-build-mode
          - name: build-bluefin
            templateRef:
              name: bst-build-re
              template: build
            depends: detect-build-mode
            arguments:
              parameters:
                - name: element
                  value: "oci/bluefin.bst"
                - name: tag
                  value: "dakota"
                - name: ref
                  value: "{{inputs.parameters.ref}}"
                - name: commit-sha
                  value: "{{inputs.parameters.commit-sha}}"
                - name: image-tag
                  value: "{{inputs.parameters.image-tag}}"
                - name: repo
                  value: "{{inputs.parameters.repo}}"
                - name: registry
                  value: "{{inputs.parameters.registry}}"
          - name: build-bluefin-nvidia
            template: bst-build-nonblocking
            depends: detect-build-mode
            when: "{{inputs.parameters.variants}} == all"
            arguments:
              parameters:
                - name: element
                  value: "oci/bluefin-nvidia.bst"
                - name: tag
                  value: "dakota-nvidia"
                - name: ref
                  value: "{{inputs.parameters.ref}}"
                - name: commit-sha
                  value: "{{inputs.parameters.commit-sha}}"
                - name: image-tag
                  value: "{{inputs.parameters.image-tag}}"
                - name: repo
                  value: "{{inputs.parameters.repo}}"
                - name: registry
                  value: "{{inputs.parameters.registry}}"
          # Gaming variants mirror the dakota CI build.yml matrix: same
          # elements, `-o gaming true` (derived from the tag in bst-build-re),
          # published with -gaming suffixes. Non-blocking like nvidia: the lab
          # has no GPU test hardware for these lanes.
          - name: build-bluefin-gaming
            template: bst-build-nonblocking
            depends: detect-build-mode
            when: "{{inputs.parameters.variants}} == all"
            arguments:
              parameters:
                - name: element
                  value: "oci/bluefin.bst"
                - name: tag
                  value: "dakota-gaming"
                - name: ref
                  value: "{{inputs.parameters.ref}}"
                - name: commit-sha
                  value: "{{inputs.parameters.commit-sha}}"
                - name: image-tag
                  value: "{{inputs.parameters.image-tag}}"
                - name: repo
                  value: "{{inputs.parameters.repo}}"
                - name: registry
                  value: "{{inputs.parameters.registry}}"
          - name: build-bluefin-nvidia-gaming
            template: bst-build-nonblocking
            depends: detect-build-mode
            when: "{{inputs.parameters.variants}} == all"
            arguments:
              parameters:
                - name: element
                  value: "oci/bluefin-nvidia.bst"
                - name: tag
                  value: "dakota-nvidia-gaming"
                - name: ref
                  value: "{{inputs.parameters.ref}}"
                - name: commit-sha
                  value: "{{inputs.parameters.commit-sha}}"
                - name: image-tag
                  value: "{{inputs.parameters.image-tag}}"
                - name: repo
                  value: "{{inputs.parameters.repo}}"
                - name: registry
                  value: "{{inputs.parameters.registry}}"
    # Steps wrapper: continueOn is not allowed on DAG tasks that use depends.
    - name: bst-build-nonblocking
      inputs:
        parameters:
          - name: element
          - name: tag
          - name: ref
          - name: commit-sha
          - name: image-tag
          - name: repo
          - name: registry
      steps:
        - - name: build
            templateRef:
              name: bst-build-re
              template: build
            continueOn:
              failed: true
            arguments:
              parameters:
                - name: element
                  value: "{{inputs.parameters.element}}"
                - name: tag
                  value: "{{inputs.parameters.tag}}"
                - name: ref
                  value: "{{inputs.parameters.ref}}"
                - name: commit-sha
                  value: "{{inputs.parameters.commit-sha}}"
                - name: image-tag
                  value: "{{inputs.parameters.image-tag}}"
                - name: repo
                  value: "{{inputs.parameters.repo}}"
                - name: registry
                  value: "{{inputs.parameters.registry}}"
