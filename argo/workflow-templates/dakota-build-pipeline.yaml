apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: dakota-build-pipeline
  namespace: argo
  annotations:
    description: |
      Dakota BST build pipeline. Builds the default bluefin OCI variant and
      the NVIDIA variant in parallel using the shared Buildbarn frontend.
      BuildStream driver pods use node-local persistent cache directories on ghost/exo-0.
      Triggered by push to dakota:testing via the shared bst-commit-poller template.
      On success, exports to local Zot (:30500) as dakota:<image-tag> and
      dakota-nvidia:<image-tag> (default "testing").
      NVIDIA builds run with continueOn (non-blocking) as the lab does not have GPU
      hardware to test NVIDIA runtime execution.
      Uses bst-build PriorityClass.
  labels:
    app.kubernetes.io/component: dakota-build
    app.kubernetes.io/part-of: bluefin-test-suite
spec:
  serviceAccountName: argo
  # One pipeline is admitted at a time by the cluster-wide bst-build
  # semaphore; the two variant drivers inside that pipeline remain parallel.
  # Cold bootstrap + source fetch + package compilation can exceed the prior 6h
  # per-pod deadline, so allow a full 12h per build pod and a 24h workflow
  # ceiling to cover one complete build/export path without killing it mid-run.
  activeDeadlineSeconds: 86400

  arguments:
    parameters:
      - name: repo
        value: "https://github.com/projectbluefin/dakota.git"
      - name: ref
        value: "testing"
      - name: commit-sha
        value: ""
      - name: image-tag
        value: "testing"
      - name: registry
        value: "192.168.1.102:30500"
      - name: build-mode
        value: "re"
      - name: lock-key
        value: "bst-build"
      # "all" keeps the full matrix. "default" builds only oci/bluefin.bst,
      # which is what a single-machine rebase needs: the four-variant fan-out
      # cannot schedule on a two-node grid (pod anti-affinity leaves retries
      # Unschedulable: "0/2 nodes are available: 2 node(s) didn't match pod
      # anti-affinity rules") and the extra variants are wasted work there.
      - name: variants
        value: "all"

  entrypoint: build
  metrics:
    prometheus:
      - name: lab_build_workflow_completed_total
        help: Completed lab build workflows by pipeline and status.
        labels:
          - key: pipeline
            value: dakota
          - key: status
            value: "{{workflow.status}}"
        counter:
          value: "1"
      - name: lab_build_workflow_duration_seconds
        help: Lab build workflow duration in seconds by pipeline and status.
        labels:
          - key: pipeline
            value: dakota
          - key: status
            value: "{{workflow.status}}"
        histogram:
          buckets: [300, 900, 1800, 3600, 7200, 14400, 28800, 43200, 86400]
          value: "{{workflow.duration}}"
  
  templates:

    - name: build
      inputs:
        parameters:
          - name: ref
            value: "{{workflow.parameters.ref}}"
          - name: commit-sha
            value: "{{workflow.parameters.commit-sha}}"
          - name: image-tag
            value: "{{workflow.parameters.image-tag}}"
          - name: repo
            value: "{{workflow.parameters.repo}}"
          - name: registry
            value: "{{workflow.parameters.registry}}"
          - name: build-mode
            value: "re"
          - name: lock-key
            value: "{{workflow.parameters.lock-key}}"
          # Callers that reach this template through templateRef (bst-commit-poller,
          # bst-cache-warm) declare no `variants` workflow parameter, so it has
          # to arrive as an input with a default rather than be read from
          # workflow scope.
          - name: variants
            value: "all"
      synchronization:
        semaphores:
          - configMapKeyRef:
              name: workflow-semaphores
              key: bst-build
      steps:
        - - name: detect-build-mode
            template: detect-build-mode
            arguments:
              parameters:
                - name: build-mode
                  value: "{{inputs.parameters.build-mode}}"
        - - name: core
            template: build-core
            arguments:
              parameters:
                - name: ref
                  value: "{{inputs.parameters.ref}}"
                - name: commit-sha
                  value: "{{inputs.parameters.commit-sha}}"
                - name: image-tag
                  value: "{{inputs.parameters.image-tag}}"
                - name: repo
                  value: "{{inputs.parameters.repo}}"
                - name: registry
                  value: "{{inputs.parameters.registry}}"
                - name: build-mode
                  value: "{{steps.detect-build-mode.outputs.parameters.mode}}"
                - name: lock-key
                  value: "{{inputs.parameters.lock-key}}"
                - name: variants
                  value: "{{inputs.parameters.variants}}"

    - name: build-warmup
      synchronization:
        semaphores:
          - configMapKeyRef:
              name: workflow-semaphores
              key: bst-cache-warm
      inputs:
        parameters:
          - name: ref
            value: "{{workflow.parameters.ref}}"
          - name: commit-sha
            value: "{{workflow.parameters.commit-sha}}"
          - name: image-tag
            value: "{{workflow.parameters.image-tag}}"
          - name: repo
            value: "{{workflow.parameters.repo}}"
          - name: registry
            value: "{{workflow.parameters.registry}}"
          - name: build-mode
            value: "re"
          - name: lock-key
            value: ""
          # Callers that reach this template through templateRef (bst-commit-poller,
          # bst-cache-warm) declare no `variants` workflow parameter, so it has
          # to arrive as an input with a default rather than be read from
          # workflow scope.
          - name: variants
            value: "all"
      steps:
        - - name: core
            template: build-core
            arguments:
              parameters:
                - name: ref
                  value: "{{inputs.parameters.ref}}"
                - name: commit-sha
                  value: "{{inputs.parameters.commit-sha}}"
                - name: image-tag
                  value: "{{inputs.parameters.image-tag}}"
                - name: repo
                  value: "{{inputs.parameters.repo}}"
                - name: registry
                  value: "{{inputs.parameters.registry}}"
                - name: build-mode
                  value: "{{inputs.parameters.build-mode}}"
                - name: lock-key
                  value: "{{inputs.parameters.lock-key}}"
                - name: variants
                  value: "{{inputs.parameters.variants}}"

    - name: build-core
      inputs:
        parameters:
          - name: ref
            value: "{{workflow.parameters.ref}}"
          - name: commit-sha
            value: "{{workflow.parameters.commit-sha}}"
          - name: image-tag
            value: "{{workflow.parameters.image-tag}}"
          - name: repo
            value: "{{workflow.parameters.repo}}"
          - name: registry
            value: "{{workflow.parameters.registry}}"
          - name: build-mode
            value: "re"
          - name: lock-key
            value: "{{workflow.parameters.lock-key}}"
          - name: variants
            value: "all"
      dag:
        tasks:
          - name: detect-build-mode
            template: detect-build-mode
            arguments:
              parameters:
                - name: build-mode
                  value: "{{inputs.parameters.build-mode}}"
          - name: build-bluefin
            template: run-bst-step
            depends: detect-build-mode
            arguments:
              parameters:
                - name: element
                  value: "oci/bluefin.bst"
                - name: tag
                  value: "dakota"
                - name: ref
                  value: "{{inputs.parameters.ref}}"
                - name: commit-sha
                  value: "{{inputs.parameters.commit-sha}}"
                - name: image-tag
                  value: "{{inputs.parameters.image-tag}}"
                - name: repo
                  value: "{{inputs.parameters.repo}}"
                - name: registry
                  value: "{{inputs.parameters.registry}}"
                - name: mode
                  value: "{{tasks.detect-build-mode.outputs.parameters.mode}}"
                - name: lock-key
                  value: "{{inputs.parameters.lock-key}}"
          - name: build-bluefin-nvidia
            template: run-bst-step-nonblocking
            depends: detect-build-mode
            when: "{{inputs.parameters.variants}} == all"
            arguments:
              parameters:
                - name: element
                  value: "oci/bluefin-nvidia.bst"
                - name: tag
                  value: "dakota-nvidia"
                - name: ref
                  value: "{{inputs.parameters.ref}}"
                - name: commit-sha
                  value: "{{inputs.parameters.commit-sha}}"
                - name: image-tag
                  value: "{{inputs.parameters.image-tag}}"
                - name: repo
                  value: "{{inputs.parameters.repo}}"
                - name: registry
                  value: "{{inputs.parameters.registry}}"
                - name: mode
                  value: "{{tasks.detect-build-mode.outputs.parameters.mode}}"
                - name: lock-key
                  value: "{{inputs.parameters.lock-key}}"
          # Gaming variants mirror the dakota CI build.yml matrix: same
          # elements, `-o gaming true` (derived from the tag in bst-build-re),
          # published with -gaming suffixes. Non-blocking like nvidia: the lab
          # has no GPU test hardware for these lanes.
          - name: build-bluefin-gaming
            template: run-bst-step-nonblocking
            depends: detect-build-mode
            when: "{{inputs.parameters.variants}} == all"
            arguments:
              parameters:
                - name: element
                  value: "oci/bluefin.bst"
                - name: tag
                  value: "dakota-gaming"
                - name: ref
                  value: "{{inputs.parameters.ref}}"
                - name: commit-sha
                  value: "{{inputs.parameters.commit-sha}}"
                - name: image-tag
                  value: "{{inputs.parameters.image-tag}}"
                - name: repo
                  value: "{{inputs.parameters.repo}}"
                - name: registry
                  value: "{{inputs.parameters.registry}}"
                - name: mode
                  value: "{{tasks.detect-build-mode.outputs.parameters.mode}}"
                - name: lock-key
                  value: "{{inputs.parameters.lock-key}}"
          - name: build-bluefin-nvidia-gaming
            template: run-bst-step-nonblocking
            depends: detect-build-mode
            when: "{{inputs.parameters.variants}} == all"
            arguments:
              parameters:
                - name: element
                  value: "oci/bluefin-nvidia.bst"
                - name: tag
                  value: "dakota-nvidia-gaming"
                - name: ref
                  value: "{{inputs.parameters.ref}}"
                - name: commit-sha
                  value: "{{inputs.parameters.commit-sha}}"
                - name: image-tag
                  value: "{{inputs.parameters.image-tag}}"
                - name: repo
                  value: "{{inputs.parameters.repo}}"
                - name: registry
                  value: "{{inputs.parameters.registry}}"
                - name: mode
                  value: "{{tasks.detect-build-mode.outputs.parameters.mode}}"
                - name: lock-key
                  value: "{{inputs.parameters.lock-key}}"
    # Dakota builds are distributed-only. Non-RE modes are rejected to prevent
    # local/serial bypasses that write large build state to node root disks.
    - name: detect-build-mode
      inputs:
        parameters:
          - name: build-mode
      outputs:
        parameters:
          - name: mode
            valueFrom:
              path: /tmp/mode
      script:
        image: cgr.dev/chainguard/kubectl:latest-dev
        command: [bash]
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
        source: |
          set -euo pipefail
          REQUESTED="{{inputs.parameters.build-mode}}"
          if [[ "${REQUESTED}" != "re" ]]; then
            echo "Dakota build-mode '${REQUESTED}' is forbidden; only distributed mode ('re') is permitted" >&2
            exit 1
          fi

          MAX_AGE_SECONDS=60
          NOW="$(date -u +%s)"
          for NODE in ghost exo-0; do
            LINK="$(kubectl get node "${NODE}" -o jsonpath='{.metadata.labels.lab\.projectbluefin\.io/usb4-link}')"
            if [[ -z "${LINK}" ]]; then
              LINK="$(kubectl get node "${NODE}" -o jsonpath='{.metadata.annotations.lab\.projectbluefin\.io/usb4-link}')"
            fi
            OBSERVED_AT="$(kubectl get node "${NODE}" -o jsonpath='{.metadata.annotations.lab\.projectbluefin\.io/usb4-link-observed-at}')"
            READY="$(kubectl get node "${NODE}" -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}')"

            if [[ "${LINK}" != "up" || ! "${OBSERVED_AT}" =~ ^[0-9]+$ || "${READY}" != "True" ]]; then
              echo "USB4 BuildBarn gate rejected ${NODE}: link=${LINK:-missing} (label/annotation lab.projectbluefin.io/usb4-link) observed-at=${OBSERVED_AT:-missing} ready=${READY:-unknown}" >&2
              exit 1
            fi
            if (( NOW - OBSERVED_AT > MAX_AGE_SECONDS )); then
              echo "USB4 BuildBarn gate rejected ${NODE}: observation is stale ($((NOW - OBSERVED_AT))s old)" >&2
              exit 1
            fi
          done

          # Match the BuildBarn worker containers by name, not by container
          # count: the DaemonSet also runs preparation sidecars whose readiness
          # is a separate health boundary from outer remote execution.
          WORKERS="$(kubectl get pods -n buildbarn -l app=worker -o jsonpath='{range .items[*]}{.spec.nodeName}{"|"}{.status.phase}{"|worker="}{range .status.containerStatuses[?(@.name=="worker")]}{.ready}{end}{"|runner="}{range .status.containerStatuses[?(@.name=="runner")]}{.ready}{end}{"\n"}{end}')"
          for NODE in ghost exo-0; do
            if ! grep -Eq "^${NODE}\|Running\|worker=true\|runner=true$" <<<"${WORKERS}"; then
              echo "USB4 BuildBarn gate rejected: no Ready worker on ${NODE}" >&2
              exit 1
            fi
          done

          echo "USB4-backed BuildBarn remote execution admitted"
          printf '%s' re > /tmp/mode

    - name: run-bst-step
      inputs:
        parameters:
          - name: element
          - name: tag
          - name: ref
          - name: commit-sha
          - name: image-tag
          - name: repo
          - name: registry
          - name: mode
          - name: lock-key
      dag:
        tasks:
          - name: bst-re
            template: bst-build-re
            when: "'{{inputs.parameters.mode}}' == 're'"
            arguments:
              parameters:
                - name: element
                  value: "{{inputs.parameters.element}}"
                - name: tag
                  value: "{{inputs.parameters.tag}}"
                - name: ref
                  value: "{{inputs.parameters.ref}}"
                - name: commit-sha
                  value: "{{inputs.parameters.commit-sha}}"
                - name: image-tag
                  value: "{{inputs.parameters.image-tag}}"
                - name: repo
                  value: "{{inputs.parameters.repo}}"
                - name: registry
                  value: "{{inputs.parameters.registry}}"
                - name: mode
                  value: "{{inputs.parameters.mode}}"
                - name: lock-key
                  value: "{{inputs.parameters.lock-key}}"

    - name: run-bst-step-nonblocking
      inputs:
        parameters:
          - name: element
          - name: tag
          - name: ref
          - name: commit-sha
          - name: image-tag
          - name: repo
          - name: registry
          - name: mode
          - name: lock-key
      dag:
        tasks:
          - name: run-bst-step
            template: run-bst-step
            continueOn:
              failed: true
            arguments:
              parameters:
                - name: element
                  value: "{{inputs.parameters.element}}"
                - name: tag
                  value: "{{inputs.parameters.tag}}"
                - name: ref
                  value: "{{inputs.parameters.ref}}"
                - name: commit-sha
                  value: "{{inputs.parameters.commit-sha}}"
                - name: image-tag
                  value: "{{inputs.parameters.image-tag}}"
                - name: repo
                  value: "{{inputs.parameters.repo}}"
                - name: registry
                  value: "{{inputs.parameters.registry}}"
                - name: mode
                  value: "{{inputs.parameters.mode}}"
                - name: lock-key
                  value: "{{inputs.parameters.lock-key}}"

    - name: bst-build-re
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - exo-0
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: workflows.argoproj.io/workflow
                    operator: In
                    values:
                      - "{{workflow.name}}"
              topologyKey: kubernetes.io/hostname
      priorityClassName: bst-build
      activeDeadlineSeconds: 10800
      retryStrategy:
        limit: "1"
        retryPolicy: "Always"
      inputs:
        parameters:
          - name: element
          - name: tag
          - name: ref
          - name: commit-sha
          - name: image-tag
          - name: repo
          - name: registry
          - name: mode
          - name: lock-key
      volumes:
        - name: fuse
          hostPath:
            path: /dev/fuse
        # Generic-ephemeral local-path PVC gives every pod and retry a clean,
        # dedicated 200Gi local CAS directory that is automatically reclaimed on
        # pod termination, preventing corrupted metadata from poisoning subsequent runs.
        - name: bst-cache
          ephemeral:
            volumeClaimTemplate:
              spec:
                accessModes: [ReadWriteOnce]
                storageClassName: local-path
                resources:
                  requests:
                    storage: 200Gi
        - name: buildstream-config
          configMap:
            name: buildstream-remote-cache
            items:
              - key: dakota-buildstream.conf
                path: buildstream.conf
              - key: remote-execution.conf
                path: remote-execution.conf
              - key: recc-environment.conf
                path: recc-environment.conf
              - key: apply_recc_overlay.py
                path: apply_recc_overlay.py
      script:
        image: "{{inputs.parameters.registry}}/bst2:64eb0b4930d57a92710822898fb73af6cc1ae35d"
        command: [bash]
        securityContext:
          privileged: true
          seLinuxOptions:
            type: spc_t
        env:
          - name: GRPC_POLL_STRATEGY
            value: poll
          - name: GRPC_ENABLE_FORK_SUPPORT
            value: "1"
          # The BuildStream image used by this workflow only accepts the
          # `fuse` and `copy-or-link` staging backends. The unsupported
          # `copy` backend crashes immediately with a buildbox-casd startup
          # error, so use `copy-or-link` here.
          - name: BUILDBOX_STAGER
            value: copy-or-link
          - name: RECC_ENDPOINT
            valueFrom:
              configMapKeyRef:
                name: buildstream-remote-cache
                key: recc-endpoint
          - name: XDG_CACHE_HOME
            value: "/root/.cache"
        resources:
          requests:
            cpu: "2"
            memory: 4Gi
            ephemeral-storage: 10Gi
          limits:
            cpu: "4"
            memory: 8Gi
            ephemeral-storage: 50Gi
        volumeMounts:
          - name: fuse
            mountPath: /dev/fuse
          - name: bst-cache
            mountPath: /root/.cache/buildstream
          - name: buildstream-config
            mountPath: /etc/buildstream
            readOnly: true
        source: |
          set -euo pipefail

          cp /etc/buildstream/buildstream.conf /tmp/buildstream-cluster.conf
          BST_CONF=/tmp/buildstream-cluster.conf
          ELEMENT="{{inputs.parameters.element}}"
          TAG="{{inputs.parameters.tag}}"
          IMAGE_TAG="{{inputs.parameters.image-tag}}"
          REF="{{inputs.parameters.ref}}"
          REPO="{{inputs.parameters.repo}}"
          mkdir -p "${XDG_CACHE_HOME}"
          # Retries can leave stale dulwich lock files; clear them before fetch.
          find "${XDG_CACHE_HOME}/buildstream/sources/git_repo" -type f -name '*.lock' -delete 2>/dev/null || true
          echo "=== Cloning dakota @ ${REF} ==="
          rm -rf /src
          git clone --depth=1 "${REPO}" /src
          cd /src
          COMMIT_SHA="{{inputs.parameters.commit-sha}}"
          if [[ -n "${COMMIT_SHA}" ]]; then
            echo "=== Checking out exact GitHub commit ${COMMIT_SHA} ==="
            git fetch --depth=1 origin "${COMMIT_SHA}"
            git checkout --detach "${COMMIT_SHA}"
          else
            echo "=== Checking out ref ${REF} ==="
            git fetch --depth=1 origin "${REF}"
            git checkout --detach FETCH_HEAD
          fi

          echo "=== Rewriting gnome-build-meta source URL to GitHub mirror ==="
          if [[ -f /src/elements/gnome-build-meta.bst ]]; then
            sed -i 's#https://gitlab.gnome.org/GNOME/gnome-build-meta.git#https://github.com/GNOME/gnome-build-meta.git#g' /src/elements/gnome-build-meta.bst
            python3 - <<'GBM_JUNCTION_PATCH'
          import re
          import urllib.error
          import urllib.request
          import yaml
          from pathlib import Path

          p = Path('/src/elements/gnome-build-meta.bst')
          doc = yaml.safe_load(p.read_text())

          # The RECC option and its patch target arrived in gnome-build-meta
          # together, and both are absent from the 50.4 line dakota pins.
          # Setting an option the junction does not declare fails the load with
          # "Unknown option 'recc' specified", exactly as a patch against a
          # missing file fails it with "include/recc.yml: No such file or
          # directory". Ask the mirror what this ref actually has.
          gbm_ref = next(
              (s.get('ref', '') for s in doc.get('sources', []) if s.get('kind') == 'git_repo'), ''
          )
          gbm_sha = (re.search(r'-g([0-9a-f]{40})$', gbm_ref) or [None, gbm_ref])[1]

          def target_exists(path_in_repo):
              url = f"https://raw.githubusercontent.com/GNOME/gnome-build-meta/{gbm_sha}/{path_in_repo}"
              try:
                  with urllib.request.urlopen(url, timeout=30) as response:
                      return response.status == 200
              except urllib.error.HTTPError as exc:
                  if exc.code == 404:
                      return False
                  raise

          gbm_has_recc = target_exists('include/recc.yml')
          if gbm_has_recc:
              # Nested RECC must stay unrequested in production.
              doc.setdefault('config', {}).setdefault('options', {})['recc'] = 'passthrough'
          else:
              options = (doc.get('config') or {}).get('options') or {}
              options.pop('recc', None)
              print(f"GBM {gbm_sha} declares no 'recc' option; leaving it unset")

          patch_dir = Path('/src/patches/gnome-build-meta')
          patch_dir.mkdir(parents=True, exist_ok=True)
          written = []
          patch_file = patch_dir / '0001-conditional-remote-apis-socket.patch'
          patch_content = (
              "--- a/include/recc.yml\n"
              "+++ b/include/recc.yml\n"
              "@@ -24,9 +24,11 @@\n"
              " - RECC_USE_LOCALCAS\n"
              " - RECC_USE_JOBSERVER\n"
              " \n"
              "-sandbox:\n"
              "-  remote-apis-socket:\n"
              "-    path: /tmp/casd.sock\n"
              "-    (?):\n"
              "-    - recc == \"upload-local-build\":\n"
              "-        action-cache-enable-update: true\n"
              "+(?):\n"
              "+- recc != \"passthrough\":\n"
              "+    sandbox:\n"
              "+      remote-apis-socket:\n"
              "+        path: /tmp/casd.sock\n"
              "+        (?):\n"
              "+        - recc == \"upload-local-build\":\n"
              "+            action-cache-enable-update: true\n"
          )
          if gbm_has_recc:
              patch_file.write_text(patch_content)
              written.append(patch_file.name)
              print("Created lab-owned conditional remote-apis-socket patch in patches/gnome-build-meta")
          else:
              patch_file.unlink(missing_ok=True)
              print(f"Skipped {patch_file.name}: GBM {gbm_sha} has no include/recc.yml")

          # 0002 disables test builds in sdk-deps/glib-stage1.bst (-Dtests=false -Dinstalled_tests=false).
          # In stage1, glib-compile-resources fails to run test resource generators (like test5.gresource)
          # because the runtime libgio shared library is not yet staged or in the runner library path.
          # As a minimal bootstrap compiler tool, stage1 does not need to build internal unit tests.
          patch2_file = patch_dir / '0002-glib-stage1-serialize-jobs.patch'
          patch2_content = (
              "--- a/elements/sdk-deps/glib-stage1.bst\n"
              "+++ b/elements/sdk-deps/glib-stage1.bst\n"
              "@@ -10,3 +10,5 @@ variables:\n"
              "     -Dselinux=disabled\n"
              "     -Dsysprof=disabled\n"
              "     -Dsystemtap=disabled\n"
              "+    -Dtests=false\n"
              "+    -Dinstalled_tests=false\n"
          )
          patch2_file.write_text(patch2_content)
          written.append(patch2_file.name)
          print("Created 0002-glib-stage1-serialize-jobs.patch with -Dtests=false")

          # 0003 wraps meson-build in sdk/gobject-introspection.bst with LD_LIBRARY_PATH
          # pointing to '$(pwd)/_builddir/girepository:${LD_LIBRARY_PATH:-}' while preserving
          # 'jobserver_pool.py -j${JOBS}' so g-ir-compiler finds uninstalled libgirepository-1.0.so.1
          # during build while maintaining cluster concurrency control.
          patch3_file = patch_dir / '0003-gobject-introspection-ld-library-path.patch'
          patch3_content = (
              "--- a/elements/sdk/gobject-introspection.bst\n"
              "+++ b/elements/sdk/gobject-introspection.bst\n"
              "@@ -15,1 +15,3 @@ variables:\n"
              "     -Dgtk_doc=true\n"
              "+  meson-build: >-\n"
              "+    env LD_LIBRARY_PATH=\"$(pwd)/_builddir/girepository:${LD_LIBRARY_PATH:-}\" jobserver_pool.py -j${JOBS} ninja -v -C _builddir\n"
          )
          patch3_file.write_text(patch3_content)
          written.append(patch3_file.name)
          print("Created 0003-gobject-introspection-ld-library-path.patch with meson-build wrapper")
          # Patch NetworkManager to disable docs generation in RE sandbox
          patch4_file = patches_dir / "0004-networkmanager-disable-docs.patch"
          patch4_content = (
              "diff --git a/elements/core-deps/NetworkManager.bst b/elements/core-deps/NetworkManager.bst\n"
              "--- a/elements/core-deps/NetworkManager.bst\n"
              "+++ b/elements/core-deps/NetworkManager.bst\n"
              "@@ -46,7 +46,7 @@ variables:\n"
              "     -Dcrypto=gnutls\n"
              "     -Dintrospection=true\n"
              "     -Dvapi=true\n"
              "-    -Ddocs=true\n"
              "+    -Ddocs=false\n"
              "     -Dtests=no\n"
              "     -Dlibaudit=no\n"
              "     -Dnmtui=false\n"
          )
          patch4_file.write_text(patch4_content)
          written.append(patch4_file.name)
          print("Created 0004-networkmanager-disable-docs.patch")
          # Only wire the queue in when something is actually in it: an empty or
          # partially-populated queue is what turns a skippable patch into a
          # hard load failure.
          sources = doc.setdefault('sources', [])
          has_queue = any(
              s.get('kind') == 'patch_queue' and s.get('path') == 'patches/gnome-build-meta'
              for s in sources
          )
          if written and not has_queue:
              sources.append({'kind': 'patch_queue', 'path': 'patches/gnome-build-meta'})
          elif not written and has_queue:
              doc['sources'] = [
                  s for s in sources
                  if not (s.get('kind') == 'patch_queue' and s.get('path') == 'patches/gnome-build-meta')
              ]
          p.write_text(yaml.safe_dump(doc, sort_keys=False))
          print(f"gnome-build-meta junction: recc=passthrough, patches={written or 'none'}")
          GBM_JUNCTION_PATCH
          fi
          if [[ -f /src/elements/bluefin/common.bst ]]; then
            sed -i 's#rm -f "%{install-root}%{sysconfdir}/profile.d/umotd.sh"#rm -f "%{install-root}%{sysconfdir}/profile.d/umotd.sh" || true#g' /src/elements/bluefin/common.bst
          fi
          echo "=== Patching bootc element to bypass manpage generation in this environment ==="
          python3 - <<'BOOTC_PATCH'
          from pathlib import Path
          path = Path('/src/elements/gnomeos-deps/bootc.bst')
          text = path.read_text()
          old = 'kind: make\n\nsources:\n'
          new = r"""kind: make

          config:
            build-commands:
            - |
              python3 - <<'PY'
              import os
              from pathlib import Path
              p = Path("Makefile")
              t = p.read_text()
              old = ".PHONY: manpages\nmanpages:\n\tcargo run --release --package xtask -- manpages\n"
              new = ".PHONY: manpages\nmanpages:\n\t@true\n"
              if new in t:
                  # The bb_worker native file pool hardlinks input-root files;
                  # an in-place write through a hardlink poisons the pooled
                  # blob for every later action. A previous run's truncate-
                  # write already mutated this file, so treat the neutralized
                  # target as success.
                  print("bootc manpages target already neutralized; skipping")
              elif old in t:
                  # Atomic replace: never mutate the hardlinked input file in
                  # place (that corrupts the worker file pool).
                  tmp = p.with_name(".Makefile.patch-tmp")
                  tmp.write_text(t.replace(old, new, 1))
                  os.replace(tmp, p)
              else:
                  import hashlib
                  i = t.find("manpages")
                  print("RE-DIAG cwd:", os.getcwd())
                  print("RE-DIAG Makefile sha256:", hashlib.sha256(t.encode()).hexdigest(), "len:", len(t))
                  print("RE-DIAG manpages context:", repr(t[max(0, i - 120):i + 200]))
                  raise SystemExit("bootc Makefile layout changed unexpectedly")
              PY
            - make PREFIX="/usr"

          sources:
          """

          if old not in text:
              raise SystemExit('bootc element layout changed unexpectedly')
          path.write_text(text.replace(old, new, 1))
          BOOTC_PATCH

          echo "=== Synchronizing upstream patch queues for cache reuse ==="
          rm -rf /tmp/upstream-patches
          mkdir -p /tmp/upstream-patches

          if git clone --depth=1 https://github.com/GNOME/gnome-build-meta.git /tmp/upstream-patches/gnome-build-meta; then
            (
              cd /tmp/upstream-patches/gnome-build-meta
              GNOME_REF=$(awk -F': ' '/^  ref:/{print $2; exit}' /src/elements/gnome-build-meta.bst | tr -d '\r')
              GNOME_COMMIT="${GNOME_REF##*-g}"
              if git fetch --depth=1 origin "${GNOME_COMMIT}"; then
                git checkout --detach FETCH_HEAD
                if [[ -d patches/gnome-build-meta ]]; then
                  # Copy upstream patch files only (excluding series/metadata) so patch_queue globbing only applies valid regular diff files
                  find patches/gnome-build-meta -mindepth 1 -maxdepth 1 -type f ! -name 'series' -exec cp -a {} /src/patches/gnome-build-meta/ \;
                fi
              else
                echo "WARN: unable to fetch gnome-build-meta commit ${GNOME_COMMIT}; continuing without patch sync"
              fi
            )
          else
            echo "WARN: unable to clone gnome-build-meta upstream patch repo; continuing without patch sync"
          fi

          if git clone --depth=1 https://gitlab.com/freedesktop-sdk/freedesktop-sdk.git /tmp/upstream-patches/freedesktop-sdk; then
            (
              cd /tmp/upstream-patches/freedesktop-sdk
              FDS_REF=$(awk -F': ' '/^  ref:/{print $2; exit}' /src/elements/freedesktop-sdk.bst | tr -d '\r')
              FDS_COMMIT="${FDS_REF##*-g}"
              if git fetch --depth=1 origin "${FDS_COMMIT}"; then
                git checkout --detach FETCH_HEAD
                if [[ -d patches/freedesktop-sdk ]]; then
                  rm -rf /src/patches/freedesktop-sdk
                  cp -a patches/freedesktop-sdk /src/patches/freedesktop-sdk
                fi
                # Patch components/libmbim.bst so mbimcli finds uninstalled build-tree library libmbim-glib during help2man
                mkdir -p /src/patches/freedesktop-sdk
                printf '%s\n' \
                  'diff --git a/elements/components/libmbim.bst b/elements/components/libmbim.bst' \
                  'index fa0df83..9744707 100644' \
                  '--- a/elements/components/libmbim.bst' \
                  '+++ b/elements/components/libmbim.bst' \
                  '@@ -29,3 +29,7 @@ sources:' \
                  '   exclude:' \
                  "   - '*-dev'" \
                  '   ref: 1.34.0-0-g2bca5d22137883f348cb117597746483637491db' \
                  '+' \
                  '+variables:' \
                  '+  meson-build: >-' \
                  '+    env LD_LIBRARY_PATH="$(pwd)/_builddir/src/libmbim-glib:${LD_LIBRARY_PATH:-}" ninja -v -j ${JOBS} -C _builddir' \
                  > /src/patches/freedesktop-sdk/0002-libmbim-meson-build.patch
                echo "Added 0002-libmbim-meson-build.patch to patches/freedesktop-sdk"
                # Patch components/libqmi.bst so qmi-firmware-update and qmicli find uninstalled build-tree libraries during help2man
                printf '%s\n' \
                  'diff --git a/elements/components/libqmi.bst b/elements/components/libqmi.bst' \
                  'index 6ee13b4..7a892b1 100644' \
                  '--- a/elements/components/libqmi.bst' \
                  '+++ b/elements/components/libqmi.bst' \
                  '@@ -31,3 +31,7 @@ sources:' \
                  '   exclude:' \
                  "   - '*-dev'" \
                  '   ref: 1.38.0-0-ge3d79ed3f7fdc6a7fa8b374860b1c23a8f172812' \
                  '+' \
                  '+variables:' \
                  '+  meson-build: >-' \
                  '+    env LD_LIBRARY_PATH="$(pwd)/_builddir/src/libqmi-glib:${LD_LIBRARY_PATH:-}" ninja -v -j ${JOBS} -C _builddir' \
                  > /src/patches/freedesktop-sdk/0003-libqmi-meson-build.patch
                echo "Added 0003-libqmi-meson-build.patch to patches/freedesktop-sdk"
              else
                echo "WARN: unable to fetch freedesktop-sdk commit ${FDS_COMMIT}; continuing without patch sync"
              fi
            )
          else
            echo "WARN: unable to clone freedesktop-sdk upstream patch repo; continuing without patch sync"
          fi

          PROJECT_NAME=$(awk -F': *' '/^name:/{print $2; exit}' project.conf | tr -d '\r')
          cat >> /tmp/buildstream-cluster.conf <<EOF
          projects:
            ${PROJECT_NAME}:
              artifacts:
                override-project-caches: false
                servers:
                # BuildStream artifact index and storage are separate BuildBarn
                # services. Keep both so locally built bootc artifacts are
                # discoverable by later distributed builds.
                - url: grpc://bb-remote-asset.buildbarn.svc.cluster.local:8984
                  type: index
                  push: true
                - url: grpc://frontend.buildbarn.svc.cluster.local:8980
                  type: storage
                  push: true
                - url: https://gbm.gnome.org:11003
                  push: false
                - url: https://cache.freedesktop-sdk.io:11001
                  push: false
              source-caches:
                # The deployed bb-remote-asset endpoint cannot FetchBlob
                # BuildStream URNs. Override junction source-cache entries so
                # no incompatible source-push server is inherited.
                override-project-caches: true
                servers:
                - url: https://gbm.gnome.org:11003
                  push: false
                - url: https://cache.freedesktop-sdk.io:11001
                  push: false
          EOF

          echo "=== Distributed build: remote execution enabled ==="
          sed 's/^/    /' /etc/buildstream/remote-execution.conf >> /tmp/buildstream-cluster.conf
          if ! grep -q '^    remote-execution:$' /tmp/buildstream-cluster.conf; then
            echo "BuildStream remote execution configuration is missing" >&2
            exit 1
          fi
          echo "=== Verified BuildStream remote execution configuration ==="

          # Gaming lanes are the same elements with the `gaming` project
          # option enabled (dakota project.conf; CI: BUILD_GAMING=true).
          # Derive from the image tag to keep template plumbing unchanged.
          GAMING_FLAG=()
          case "${TAG}" in
            *gaming*) GAMING_FLAG=(-o gaming true) ;;
          esac

          echo "=== Building ${ELEMENT} through BuildBarn remote execution ==="
          bst --config "${BST_CONF}" \
              --no-interactive \
              --max-jobs 12 \
              --fetchers 8 \
              "${GAMING_FLAG[@]}" \
              build "${ELEMENT}"

          # `bst artifact checkout` resolves by cache key, and every -o option
          # is part of that key. The build above runs with the project defaults
          # (dakota pins x86_64_v3 false, as its Justfile and CI require), so
          # checking out with `-o x86_64_v3 true` asks for a *different*
          # artifact than the one just built - stale content at best, a cache
          # miss at worst. Keep both invocations on the same options.
          echo "=== Exporting ${ELEMENT} ==="
          EXPORT_DIR="/tmp/export-$(basename ${ELEMENT} .bst)"
          mkdir -p "${EXPORT_DIR}"
          bst --config "${BST_CONF}" \
              --no-interactive \
              --max-jobs 12 \
              --fetchers 8 \
              "${GAMING_FLAG[@]}" \
              artifact checkout "${ELEMENT}" \
              --directory "${EXPORT_DIR}"

          _PUSH_DEST="{{inputs.parameters.registry}}"
          registry_host="${_PUSH_DEST#*://}"
          registry_host="${registry_host%%/*}"
          registry_host="${registry_host%%:*}"
          registry_host="$(printf '%s' "${registry_host}" | tr '[:upper:]' '[:lower:]')"
          if [[ "${registry_host}" == "ghcr.io" || "${registry_host}" == *.ghcr.io ]]; then
            echo "ERROR: GHCR push destination is forbidden: ${_PUSH_DEST}" >&2
            exit 1
          fi

          echo "=== Pushing to local Zot ==="
          if command -v skopeo >/dev/null 2>&1; then
            skopeo copy --dest-tls-verify=false "oci:${EXPORT_DIR}" "docker://{{inputs.parameters.registry}}/${TAG}:${IMAGE_TAG}"
          else
            IMAGE_ID=$(podman pull "oci:${EXPORT_DIR}" | tail -1)
            podman push "${IMAGE_ID}" "docker://{{inputs.parameters.registry}}/${TAG}:${IMAGE_TAG}" --tls-verify=false
            podman rmi "${IMAGE_ID}" 2>/dev/null || true
          fi

          echo "=== Build complete: {{inputs.parameters.registry}}/${TAG}:${IMAGE_TAG} ==="
