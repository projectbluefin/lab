apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: dakota-qa-pipeline
  namespace: argo
  annotations:
    description: |
      Container-only Dakota QA pipeline: fan out the selected smoke, common,
      developer, software, and system suites directly to run-container-tests.
      This path runs the same container runner for every selected suite without
      KubeVirt or containerDisk inputs.
  labels:
    app.kubernetes.io/component: qa-pipeline
    app.kubernetes.io/part-of: bluefin-test-suite
spec:
  serviceAccountName: argo
  parallelism: 2
  # Generous ceiling because the run-container-tests template now queues behind a
  # cross-workflow semaphore; the workflow-level deadline must outlive queue wait
  # plus the 1h per-suite test pod deadline.
  activeDeadlineSeconds: 14400
  entrypoint: pipeline
  arguments:
    parameters:
    - name: image
      value: "ghcr.io/projectbluefin/dakota"
    - name: image-tag
      value: "testing"
    - name: image-digest
      value: ""
    - name: suites
      value: "smoke,common,developer,software,system"
    - name: variant
      value: "dakota"
    - name: branch
      value: "main"
    - name: testsuite-branch
      value: "main"
    - name: testsuite-repo
      value: "https://github.com/projectbluefin/testsuite"
  templates:
  - name: pipeline
    # `spec.parallelism` is not inherited through
    # `templateRef`, so the per-workflow fan-out cap must live on the template
    # itself or one pipeline can hold most of the `ghost-container-qa` slots.
    parallelism: 2
    dag:
      tasks:
      - name: test-lane
        withItems: [smoke, common, developer, software, system]
        when: "'{{workflow.parameters.suites}}' =~ '{{item}}'"
        templateRef:
          name: run-container-tests
          template: run-container-tests
        arguments:
          parameters:
          - name: image
            value: "{{workflow.parameters.image}}"
          - name: image-tag
            value: "{{workflow.parameters.image-tag}}"
          - name: image-digest
            value: "{{workflow.parameters.image-digest}}"
          - name: suite
            value: "{{item}}"
          - name: variant
            value: "{{workflow.parameters.variant}}"
          - name: branch
            value: "{{workflow.parameters.branch}}"
          - name: testsuite-branch
            value: "{{workflow.parameters.testsuite-branch}}"
          - name: testsuite-repo
            value: "{{workflow.parameters.testsuite-repo}}"
          - name: behave-tags
            value: ""
