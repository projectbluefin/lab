apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: provision-kde-linux-vm
  namespace: argo
  annotations:
    description: |
      Downloads a published KDE Linux hybrid ISO, verifies its pinned SHA256,
      wraps it as a containerDisk, and boots it as an ephemeral OVMF/KubeVirt VM.
      KDE Linux publishes a GPT disk image and El Torito ISO in the same artifact.
      SSH access uses KubeVirt accessCredentials (qemuGuestAgent) — the live image
      does not process cloud-init. After the VMI is Ready, sshd is activated via
      the QEMU guest agent and the SSH public key is injected into the live user.
spec:
  templates:
  - name: provision-vm
    inputs:
      parameters:
      - name: vm-name
      - name: namespace
        value: "aurora-test"
      - name: image-url
        value: "https://files.kde.org/kde-linux/kde-linux_202609090254.iso"
      - name: image-sha256
        value: "4acbcf524ae780f97a70f9234194b6dc6dc344cd02e7f7ba98828223cee1de42"
      - name: ssh-pubkey-secret
        value: "bluefin-test-ssh-pubkey"
    outputs:
      parameters:
      - name: vm-ip
        valueFrom:
          parameter: "{{steps.wait-for-vm.outputs.result}}"
    steps:
    - - name: prepare-disk
        template: prepare-disk
        arguments:
          parameters:
          - name: image-url
            value: "{{inputs.parameters.image-url}}"
          - name: image-sha256
            value: "{{inputs.parameters.image-sha256}}"
    - - name: create-vm
        template: create-vm
        arguments:
          parameters:
          - name: vm-name
            value: "{{inputs.parameters.vm-name}}"
          - name: namespace
            value: "{{inputs.parameters.namespace}}"
          - name: containerdisk-digest
            value: "{{steps.prepare-disk.outputs.parameters.containerdisk-digest}}"
          - name: ssh-pubkey-secret
            value: "{{inputs.parameters.ssh-pubkey-secret}}"
    - - name: wait-for-vm
        template: wait-for-vm
        arguments:
          parameters:
          - name: vm-name
            value: "{{inputs.parameters.vm-name}}"
          - name: namespace
            value: "{{inputs.parameters.namespace}}"

  - name: prepare-disk
    inputs:
      parameters:
      - name: image-url
      - name: image-sha256
    outputs:
      parameters:
      - name: containerdisk-digest
        valueFrom:
          path: /mnt/work/containerdisk-digest.txt
    volumes:
    - name: work
      emptyDir:
        sizeLimit: 12Gi
    script:
      image: quay.io/buildah/stable@sha256:7bb110e1d8b761d08e87d004ea4086e295a52319f3ea70ecef65da6dff7ceef0
      command: [bash]
      securityContext:
        privileged: true
        runAsUser: 0
      resources:
        requests:
          cpu: "1"
          memory: 2Gi
        limits:
          cpu: "4"
          memory: 8Gi
      volumeMounts:
      - name: work
        mountPath: /mnt/work
      source: |
        set -euo pipefail
        URL="{{inputs.parameters.image-url}}"
        SHA="{{inputs.parameters.image-sha256}}"
        WORK=/mnt/work
        IMAGE="${WORK}/kde-linux.iso"
        CONTAINERDISK="192.168.1.102:30500/kde-linux-containerdisk:{{workflow.uid}}"

        [[ "${SHA}" =~ ^[[:xdigit:]]{64}$ ]] || {
          echo "image-sha256 must be a 64-character hexadecimal digest" >&2
          exit 1
        }
        curl --fail --location --retry 3 --retry-all-errors \
          --connect-timeout 30 --speed-limit 1024 --speed-time 120 --remove-on-error \
          --output "${IMAGE}" "${URL}"
        printf '%s  %s\n' "${SHA}" "${IMAGE}" | sha256sum -c -

        ctr=$(buildah from scratch)
        trap 'buildah rm "${ctr}" >/dev/null 2>&1 || true' EXIT
        buildah copy --chown 107:107 "${ctr}" "${IMAGE}" /disk/kde-linux.iso
        printf '%s\n' \
          '{"volumes":[{"image":"kde-linux.iso","capacity":"12Gi"}]}' \
          > "${WORK}/containerDisk.json"
        buildah copy "${ctr}" "${WORK}/containerDisk.json" /containerDisk.json
        buildah commit "${ctr}" "${CONTAINERDISK}"
        _registry_host="${CONTAINERDISK%%/*}"
        _registry_host="${_registry_host%%:*}"
        _registry_host="$(printf '%s' "${_registry_host}" | tr '[:upper:]' '[:lower:]')"
        if [[ "${_registry_host}" == "ghcr.io" || "${_registry_host}" == *.ghcr.io ]]; then
          echo "ERROR: GHCR push destination is forbidden: ${CONTAINERDISK}" >&2
          exit 1
        fi
        buildah push --tls-verify=false \
          --digestfile "${WORK}/containerdisk-digest.txt" "${CONTAINERDISK}"

  - name: create-vm
    inputs:
      parameters:
      - name: vm-name
      - name: namespace
      - name: containerdisk-digest
      - name: ssh-pubkey-secret
        value: "bluefin-test-ssh-pubkey"
    resource:
      action: apply
      manifest: |
        apiVersion: kubevirt.io/v1
        kind: VirtualMachine
        metadata:
          name: "{{inputs.parameters.vm-name}}"
          namespace: "{{inputs.parameters.namespace}}"
          labels:
            app: kde-linux-test
            argo-workflow: "{{workflow.name}}"
        spec:
          runStrategy: Always
          template:
            metadata:
              labels:
                kubevirt.io/vm: "{{inputs.parameters.vm-name}}"
            spec:
              priorityClassName: lab-test-vm
              # KDE Linux is a live image that does not process cloud-init.
              # SSH key injection uses KubeVirt accessCredentials via the QEMU
              # guest agent (qemu-guest-agent ships in the KDE Linux live image).
              # The key is injected into the 'live' user — the image's autologin
              # account. sshd is then activated via guest-exec in wait-for-vm.
              accessCredentials:
              - sshPublicKey:
                  source:
                    secret:
                      secretName: "{{inputs.parameters.ssh-pubkey-secret}}"
                  propagationMethod:
                    qemuGuestAgent:
                      users:
                      - live
              domain:
                firmware:
                  bootloader:
                    efi:
                      secureBoot: false
                cpu:
                  cores: 4
                memory:
                  guest: 8Gi
                devices:
                  blockMultiQueue: true
                  rng: {}
                  disks:
                  - name: rootdisk
                    disk:
                      bus: virtio
                    bootOrder: 1
                  interfaces:
                  - name: default
                    masquerade: {}
              networks:
              - name: default
                pod: {}
              volumes:
              - name: rootdisk
                containerDisk:
                  image: 192.168.1.102:30500/kde-linux-containerdisk@{{inputs.parameters.containerdisk-digest}}

  - name: wait-for-vm
    inputs:
      parameters:
      - name: vm-name
      - name: namespace
    script:
      image: ghcr.io/projectbluefin/lab-runner@sha256:fe097bb3b85a126b9a16093fbc498b4b6fb7b24e0f74162ad3d91a402dcfa940
      command: [bash]
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 256Mi
      source: |
        set -euo pipefail
        exec 3>&1
        exec 1>&2
        NS="{{inputs.parameters.namespace}}"
        VM="{{inputs.parameters.vm-name}}"

        # Step 1: wait for the VMI to report Ready.
        kubectl wait vmi -n "${NS}" "${VM}" --for=condition=Ready --timeout=900s

        # Step 2: activate sshd in the KDE Linux live guest via the QEMU guest
        # agent. KDE Linux (Arch-based) ships OpenSSH but does not start it at
        # boot. The guest agent is confirmed present once the VMI is Ready.
        VIRT_LAUNCHER=$(kubectl get pod -n "${NS}" \
          -l "kubevirt.io/vm=${VM}" \
          -o jsonpath='{.items[0].metadata.name}')
        DOMAIN_ID=$(kubectl exec -n "${NS}" "${VIRT_LAUNCHER}" -c compute -- \
          virsh list --name | head -1)

        # Try sshd.service (Arch canonical); fall back to sshd.socket (Fedora).
        # Both are best-effort — the SSH wait below is the definitive gate. The
        # exit status is only echoed (not enforced) so a permissions failure or
        # missing guest agent shows up in the log instead of surfacing 300s
        # later as an opaque port-22 timeout.
        for _unit in sshd.service sshd.socket; do
          kubectl exec -n "${NS}" "${VIRT_LAUNCHER}" -c compute -- \
            virsh qemu-agent-command "${DOMAIN_ID}" \
            "{\"execute\":\"guest-exec\",\"arguments\":{\"path\":\"systemctl\",\"arg\":[\"start\",\"${_unit}\"],\"capture-output\":false}}" \
            2>&1 | sed "s/^/guest-exec start ${_unit}: /" || true
        done

        # Step 3: wait for KubeVirt to inject the SSH public key via the guest
        # agent (AccessCredentialsSynchronized condition).
        kubectl wait vmi -n "${NS}" "${VM}" \
          --for=condition=AccessCredentialsSynchronized --timeout=120s

        # Step 4: get pod IP and wait for TCP port 22 to accept connections.
        POD_IP=$(kubectl get pod -n "${NS}" \
          -l "kubevirt.io/vm=${VM}" \
          -o jsonpath='{.items[0].status.podIP}')
        timeout 300 bash -c \
          "until bash -c 'echo >/dev/tcp/${POD_IP}/22' 2>/dev/null; do sleep 5; done"

        # Emit the pod IP to stdout (captured as the output parameter).
        printf '%s' "${POD_IP}" >&3
