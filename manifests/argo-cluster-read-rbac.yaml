# Cluster-wide read for the argo SA. Kept pipelines depend on it: the BST
# USB4 gate (detect-build-mode) reads node annotations, and kubestellar verify
# and the VM/pod reapers read across namespaces. Previously granted by the
# removed k8sgpt-runner-rbac.yaml.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: argo-cluster-read
  labels:
    app.kubernetes.io/part-of: lab
rules:
  # Read-only, and deliberately without secrets (the contribute GH token lives in one).
  - apiGroups: [""]
    resources: [nodes, pods, pods/log, namespaces, events, services, endpoints, configmaps,
      persistentvolumes, persistentvolumeclaims, serviceaccounts, resourcequotas, limitranges]
    verbs: ["get", "list", "watch"]
  - apiGroups: [apps, batch, policy, storage.k8s.io, scheduling.k8s.io, apiextensions.k8s.io,
      networking.k8s.io, discovery.k8s.io, metrics.k8s.io, argoproj.io, kubevirt.io,
      cdi.kubevirt.io, snapshot.storage.k8s.io, control.kubestellar.io, tenancy.kflex.kubestellar.org,
      cluster.open-cluster-management.io, work.open-cluster-management.io,
      addon.open-cluster-management.io, operator.open-cluster-management.io]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: argo-cluster-read
  labels:
    app.kubernetes.io/part-of: lab
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: argo-cluster-read
subjects:
  - kind: ServiceAccount
    name: argo
    namespace: argo
