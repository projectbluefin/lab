# Scale down ArgoCD components not used in this single-tenant homelab.
# ServerSideApply (configured in lab-infra Application) patches
# only the fields declared here — other fields are left intact.
#
# dex-server: SSO broker — not configured (admin local account only).
# notifications-controller: alert delivery — not configured.
# applicationset-controller: dynamic app generators — not used (static apps only).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-dex-server
  namespace: argocd
spec:
  replicas: 0
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-notifications-controller
  namespace: argocd
spec:
  replicas: 0
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-applicationset-controller
  namespace: argocd
spec:
  replicas: 0
---
# timeout.reconciliation: how stale a pushed commit may look to ArgoCD. The
# lab has no inbound GitHub webhook, so polling is the only push trigger.
# The value feeds two places through ARGOCD_RECONCILIATION_TIMEOUT:
#   - repo-server --revision-cache-expiration: how long `main` stays resolved
#     to a cached SHA. A normal refresh reuses that SHA; only a hard refresh
#     bypasses it. At 1h, pushes sat undeployed for up to an hour while the
#     controller kept "refreshing" against the old SHA.
#   - application-controller --app-resync (plus the default 60s jitter).
# 2m matches the controller's built-in default, the cadence it already ran at
# (compare_app_state about 0.1-0.7s per app, a few millicores of CPU). The
# three lab Applications share one repo URL, so this is one `git ls-remote`
# per 2 minutes; manifests are cached per SHA and only regenerate on a new
# commit. Worst case push-to-sync is about 5 minutes.
#
# resource.exclusions: stop ArgoCD watching Workflow instances and bare Pods.
# These are high-churn transient objects managed entirely by Argo Workflows,
# not by GitOps. Without this exclusion the application-controller burns CPU
# continuously diffing objects it has no authority over.
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: argocd
data:
  admin.enabled: "false"
  timeout.reconciliation: 2m
  resource.customizations.health.argoproj.io_Application: |
    hs = {}
    hs.status = "Progressing"
    hs.message = ""
    if obj.status ~= nil then
      if obj.status.health ~= nil then
        hs.status = obj.status.health.status
        hs.message = obj.status.health.message or ""
      end
      if obj.status.sync ~= nil and obj.status.sync.status ~= "Synced" then
        hs.status = "Progressing"
        hs.message = "Application is " .. obj.status.sync.status
      end
    end
    return hs
  resource.exclusions: |
    - apiGroups:
      - argoproj.io
      kinds:
      - Workflow
    - apiGroups:
      - ""
      kinds:
      - Pod
---
# server.disable.dex: suppress dex-server health checks in the API server
# (dex-server is scaled to zero above).
#
# reposerver.parallelism.limit:1 — sequential manifest rendering on repo-server.
# Prevents OOM when both lab apps sync simultaneously on this single node.
#
# controller.status.processors / controller.operation.processors: reduced from
# defaults (20/10) to match the actual load of two static ArgoCD Applications.
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cmd-params-cm
  namespace: argocd
data:
  server.disable.dex: "true"
  reposerver.parallelism.limit: "1"
  reposerver.git.request.timeout: "300s"
  controller.status.processors: "5"
  controller.operation.processors: "2"
  controller.repo.server.timeout.seconds: "360"
  server.repo.server.timeout.seconds: "360"
---
# Resource requests for ArgoCD components — currently all BestEffort (resources: {}).
# Without requests, these are first OOM-killed under VM memory pressure.
# Values are conservative: sized for 2 static apps (lab, lab-infra).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: argocd-application-controller
  namespace: argocd
spec:
  template:
    spec:
      priorityClassName: system-cluster-critical
      containers:
        - name: argocd-application-controller
          command:
            - /usr/bin/tini
            - --
            - /usr/local/bin/argocd-application-controller
          args:
            - --repo-server-timeout-seconds=360
          # REDIS_PASSWORD must be declared here: this SSA patch owns the
          # container spec, and an earlier apply wiped the upstream env list,
          # leaving the controller unauthenticated to redis (NOAUTH errors,
          # partial syncs).
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: argocd-redis
                  key: auth
                  optional: true
            - name: ARGOCD_REPO_SERVER_TIMEOUT_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: argocd-cmd-params-cm
                  key: controller.repo.server.timeout.seconds
                  optional: true
            - name: ARGOCD_RECONCILIATION_TIMEOUT
              valueFrom:
                configMapKeyRef:
                  name: argocd-cm
                  key: timeout.reconciliation
                  optional: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-repo-server
  namespace: argocd
spec:
  template:
    spec:
      priorityClassName: system-cluster-critical
      containers:
        - name: argocd-repo-server
          # 256Mi was too small to render the kubestellar-console Helm chart
          # from a cold manifest cache: steady-state syncs are served from
          # cache, but after an outage repo-server regenerates every app at
          # once and is OOMKilled (exit 137), which deadlocks ArgoCD because
          # it cannot sync the fix for its own outage. Nodes have 62 GiB;
          # 1Gi is still conservative.
          # A cold clone of this repo (~400 MB) exceeds the default 90s git
          # exec timeout, so repo-server can't fetch after a restart.
          env:
            - name: ARGOCD_EXEC_TIMEOUT
              value: 10m
          resources:
            requests:
              cpu: 50m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
    metadata:
      annotations:
        # repo-server reads timeout.reconciliation from argocd-cm only at
        # startup. Keep this equal to argocd-cm so a change rolls the pod.
        lab.projectbluefin.io/timeout-reconciliation: 2m
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-server
  namespace: argocd
spec:
  template:
    spec:
      priorityClassName: system-cluster-critical
      containers:
        - name: argocd-server
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-redis
  namespace: argocd
spec:
  template:
    spec:
      automountServiceAccountToken: true
      priorityClassName: system-cluster-critical
      containers:
        - name: redis
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
