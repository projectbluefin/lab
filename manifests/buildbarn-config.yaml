# Buildbarn storage config: sharded CAS/AC storage, the client-facing frontend
# and bb-remote-asset, adapted from the upstream reference deployment
# (github.com/buildbarn/bb-deployments kubernetes/config/*.jsonnet). Buildbarn
# is the lab's CAS and action cache only; remote execution runs on BuildGrid
# (manifests/buildgrid-*.yaml), whose controller and workers use this CAS.
apiVersion: v1
kind: ConfigMap
metadata:
  name: buildbarn-config
  namespace: buildbarn
  labels:
    app.kubernetes.io/part-of: lab
data:
  common.libsonnet: |
    // Two CAS/AC shards remain configured, but the clients now target the
    // two storage StatefulSet pods directly so a given object always lands on
    // the same shard and stays reachable for later reads.
    {
      blobstore: {
        contentAddressableStorage: {
          sharding: {
            shards: {
              "0": {
                backend: { grpc: { client: { address: 'storage-0.storage.buildbarn.svc.cluster.local:8981' } } },
                weight: 1,
              },
              "1": {
                backend: { grpc: { client: { address: 'storage-1.storage.buildbarn.svc.cluster.local:8981' } } },
                weight: 1,
              },
            },
          },
        },
        // BuildStream asks for OutputDirectoryFormat DIRECTORY_ONLY, so element
        // actions store OutputDirectory.root_directory_digest without a
        // tree_digest. completenessChecking derives tree_digest unconditionally
        // and answers NOT_FOUND ("malformed digest: No digest provided"), so
        // every element action re-executed. Expire results instead: entries
        // are served for 7-8 days after worker_completed_timestamp, well inside
        // the CAS retention (each 420GiB shard had 212GiB written in 16 days),
        // so their outputs are still stored. Remote Asset records carry no
        // worker_completed_timestamp and never expire; without the blob check
        // a stale index entry makes BuildStream fall through to the next
        // artifact server instead of failing.
        actionCache: {
          actionResultExpiring: {
            backend: {
              sharding: {
                shards: {
                  "0": {
                    backend: { grpc: { client: { address: 'storage-0.storage.buildbarn.svc.cluster.local:8981' } } },
                    weight: 1,
                  },
                  "1": {
                    backend: { grpc: { client: { address: 'storage-1.storage.buildbarn.svc.cluster.local:8981' } } },
                    weight: 1,
                  },
                },
              },
            },
            minimumValidity: '604800s',
            maximumValidityJitter: '86400s',
            // Required by bb-storage; raise it to drop a poisoned AC.
            minimumTimestamp: '1970-01-01T00:00:00Z',
          },
        },
      },
      # Large BuildStream BatchUpdateBlobs uploads (e.g. bootstrap seed imports)
      # exceed tiny gRPC caps and fail with CAS upload errors. Keep this high.
      maximumMessageSizeBytes: 64 * 1024 * 1024,
      global: {
        diagnosticsHttpServer: {
          httpServers: [{
            listenAddresses: [':9980'],
            authenticationPolicy: { allow: {} },
          }],
          enablePrometheus: true,
          enablePprof: true,
        },
      },
    }

  storage.jsonnet: |
    local common = import 'common.libsonnet';

    {
      grpcServers: [{
        listenAddresses: [':8981'],
        authenticationPolicy: { allow: {} },
      }],
      maximumMessageSizeBytes: common.maximumMessageSizeBytes,
      global: common.global,
      contentAddressableStorage: {
        backend: {
          'local': {
            keyLocationMapOnBlockDevice: {
              file: { path: '/storage-cas/key_location_map', sizeBytes: 512 * 1024 * 1024 },
            },
            keyLocationMapMaximumGetAttempts: 16,
            keyLocationMapMaximumPutAttempts: 64,
            oldBlocks: 8,
            currentBlocks: 24,
            newBlocks: 3,
            blocksOnBlockDevice: {
              source: { file: { path: '/storage-cas/blocks', sizeBytes: 420 * 1024 * 1024 * 1024 } },
              spareBlocks: 3,
            },
            persistent: {
              stateDirectoryPath: '/storage-cas/persistent_state',
              minimumEpochInterval: '60s',
            },
          },
        },
        getAuthorizer: { allow: {} },
        putAuthorizer: { allow: {} },
        findMissingAuthorizer: { allow: {} },
      },
      actionCache: {
        backend: {
          'local': {
            // One 66-byte record per entry, and this AC also stores the
            // bb-remote-asset artifact index. A 1 MiB map (15,887 slots) was
            // full: each shard dropped ~100 entries on insert (put outcome
            // TooManyAttempts) and gave up ~100-150 lookups in 2.5 hours.
            // 64 MiB is ~1M slots per shard. Resizing rehashes nothing, so
            // every existing AC and artifact-index entry becomes unreachable
            // (storage starts cleanly; the next builds miss once).
            keyLocationMapOnBlockDevice: {
              file: { path: '/storage-ac/key_location_map', sizeBytes: 64 * 1024 * 1024 },
            },
            keyLocationMapMaximumGetAttempts: 16,
            keyLocationMapMaximumPutAttempts: 64,
            oldBlocks: 8,
            currentBlocks: 24,
            newBlocks: 1,
            blocksOnBlockDevice: {
              source: { file: { path: '/storage-ac/blocks', sizeBytes: 3 * 1024 * 1024 * 1024 } },
              spareBlocks: 3,
            },
            persistent: {
              stateDirectoryPath: '/storage-ac/persistent_state',
              minimumEpochInterval: '300s',
            },
          },
        },
        getAuthorizer: { allow: {} },
        putAuthorizer: { allow: {} },
      },
    }

  frontend.jsonnet: |
    local common = import 'common.libsonnet';

    {
      grpcServers: [{
        listenAddresses: [':8980'],
        authenticationPolicy: { allow: {} },
      }],
      maximumMessageSizeBytes: common.maximumMessageSizeBytes,
      global: common.global,
      contentAddressableStorage: {
        backend: common.blobstore.contentAddressableStorage,
        getAuthorizer: { allow: {} },
        putAuthorizer: { allow: {} },
        findMissingAuthorizer: { allow: {} },
      },
      actionCache: {
        backend: common.blobstore.actionCache,
        getAuthorizer: { allow: {} },
        putAuthorizer: { allow: {} },
      },
      executeAuthorizer: { allow: {} },
    }

  remote-asset.jsonnet: |
    local common = import 'common.libsonnet';

    {
      // Route both CAS and AC lookups through BuildBarn's frontend service,
      // which acts as the authoritative Rendezvous sharding layer.
      contentAddressableStorage: {
        grpc: {
          address: 'frontend.buildbarn.svc.cluster.local:8980',
        },
      },
      assetCache: {
        actionCache: {
          grpc: {
            address: 'frontend.buildbarn.svc.cluster.local:8980',
          },
        },
      },
      // Lab clients only fetch BuildStream urn: assets they pushed. An index
      // miss used to fall through to an http fetcher that logged two
      // "unsupported protocol scheme urn" errors per miss (a fifth of this
      // log) before answering NOT_FOUND; answer NOT_FOUND directly.
      fetcher: {
        'error': { code: 5, message: 'Asset not in the lab index' },
      },
      grpcServers: [{
        listenAddresses: [':8984'],
        authenticationPolicy: { allow: {} },
      }],
      global: common.global,
      allowUpdatesForInstances: [''],
      maximumMessageSizeBytes: 64 * 1024 * 1024,
      fetchAuthorizer: { allow: {} },
      pushAuthorizer: { allow: {} },
    }

