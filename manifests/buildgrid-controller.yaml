# BuildGrid scheduler front ends, split the way upstream deploys them.
#
# - controller: REAPI Execution + Operations for clients. BuildStream sends every
#   element build here, and worker casd forwards GNOME recc compile actions here.
#   Each in-flight action holds one streaming Execute RPC for its whole run, so
#   the thread pool is sized for hundreds of concurrent actions.
# - bots: Remote Workers API only. buildbox-worker bot sessions never share a
#   thread pool with Execute streams; co-locating them let a recc fan-out starve
#   UpdateBotSession ("Concurrent RPC limit exceeded") and crash workers
#   mid-action.
#
# Both share one Postgres-backed scheduler, so a job queued through the
# controller is leased through bots. Workers are not pinned or enumerated: a new
# node gets a worker from the DaemonSet, it opens a bot session, and it starts
# draining the shared queue.
#
# CAS and the action cache stay in Buildbarn; the scheduler reads Actions and
# records ActionResults there through BuildGrid's remote proxies.
#
# Platform matching: OSFamily/ISA must match the worker. BuildStream also sends
# unixUID/unixGID, network and remoteApisSocketPath, and GNOME's recc actions
# send chrootRootDigest. Those are per-action runner inputs that
# buildbox-run-bubblewrap implements, so they are accepted without constraining
# worker selection.
apiVersion: v1
kind: ConfigMap
metadata:
  name: buildgrid-config
  namespace: buildgrid
  labels:
    app.kubernetes.io/part-of: lab
data:
  controller.yml: |
    server:
      - !channel
        address: "[::]:50051"
        insecure-mode: true

    description: >
      Lab BuildGrid controller: Execution and Operations; CAS and AC in Buildbarn.

    grpc-server-options:
      grpc.max_connection_age_ms: 300000

    authorization:
      method: none

    monitoring:
      enabled: false

    connections:
      - !sql-connection &sql
        connection-string: postgresql://bgd@database.buildgrid.svc.cluster.local:5432/bgd
        pool-size: 40
        pool-timeout: 30
        max-overflow: 60

    # with-cache-storage makes BuildGrid walk input trees itself; a bare
    # remote-storage forwards GetTree, which Buildbarn does not implement.
    storages:
      - !remote-storage &buildbarn
        url: http://frontend.buildbarn.svc.cluster.local:8980
        instance-name: ''
      - !with-cache-storage &cas-storage
        cache: !lru-storage
          size: 512M
        fallback: *buildbarn

    caches:
      - !remote-action-cache &build-cache
        url: http://frontend.buildbarn.svc.cluster.local:8980
        instance-name: ''

    # Keep this scheduler block identical in controller.yml and bots.yml.
    schedulers:
      - !sql-scheduler &state-database
        sql: *sql
        storage: *cas-storage
        action-cache: *build-cache
        # Large element builds (webkit, mozjs, llvm) run for hours.
        max-execution-timeout: 43200
        poll-interval: 0.5
        # Spread work across nodes. Without sampling, assign-by-capacity leases
        # to the first healthy bot with a free slot (an unordered LIMIT 1), so
        # one node takes up to CONCURRENT_JOBS element builds (make -j12 each)
        # while the other idles. Sampling scores every bot by remaining
        # capacity; sample-size covers more bots than the lab has. Four threads
        # keep assignment ahead of recc fan-out on 64+ slots of ~3s actions.
        assigners:
          - !priority-age-assigner
            count: 4
            interval: 1.0
            bot-assignment-strategy: !assign-by-capacity
              sampling: !sampling-config
                sample-size: 8
                max-attempts: 3
                weights: !sampling-weights
                  priority: -10.0
                  locality: 5.0
                  capacity: 1.0
        pruner-job-max-age:
          days: 7
        property-set: !dynamic-property-set
          match-property-keys:
            - OSFamily
            - ISA
          wildcard-property-keys:
            - unixUID
            - unixGID
            - network
            - remoteApisSocketPath
            - chrootRootDigest
            - capability

    instances:
      - name: ''
        description: The unnamed lab instance.
        services:
          - !execution
            scheduler: *state-database
            endpoints:
              - execution
              - operations

    # Every queued or running action holds one streaming Execute RPC (one
    # thread) until it completes. GNOME recc fans one element out into hundreds
    # of compile actions at once, so the pool is sized for a deep queue, not for
    # the number of worker slots.
    thread-pool-size: 2000
    maximum-concurrent-rpcs: 2000

  bots.yml: |
    server:
      - !channel
        address: "[::]:50051"
        insecure-mode: true

    description: >
      Lab BuildGrid bots interface: Remote Workers API only.

    grpc-server-options:
      grpc.max_connection_age_ms: 300000

    authorization:
      method: none

    monitoring:
      enabled: false

    connections:
      - !sql-connection &sql
        connection-string: postgresql://bgd@database.buildgrid.svc.cluster.local:5432/bgd
        pool-size: 10
        pool-timeout: 30
        max-overflow: 20

    # with-cache-storage makes BuildGrid walk input trees itself; a bare
    # remote-storage forwards GetTree, which Buildbarn does not implement.
    storages:
      - !remote-storage &buildbarn
        url: http://frontend.buildbarn.svc.cluster.local:8980
        instance-name: ''
      - !with-cache-storage &cas-storage
        cache: !lru-storage
          size: 512M
        fallback: *buildbarn

    caches:
      - !remote-action-cache &build-cache
        url: http://frontend.buildbarn.svc.cluster.local:8980
        instance-name: ''

    # Keep this scheduler block identical in controller.yml and bots.yml.
    schedulers:
      - !sql-scheduler &state-database
        sql: *sql
        storage: *cas-storage
        action-cache: *build-cache
        # Large element builds (webkit, mozjs, llvm) run for hours.
        max-execution-timeout: 43200
        poll-interval: 0.5
        # Spread work across nodes. Without sampling, assign-by-capacity leases
        # to the first healthy bot with a free slot (an unordered LIMIT 1), so
        # one node takes up to CONCURRENT_JOBS element builds (make -j12 each)
        # while the other idles. Sampling scores every bot by remaining
        # capacity; sample-size covers more bots than the lab has. Four threads
        # keep assignment ahead of recc fan-out on 64+ slots of ~3s actions.
        assigners:
          - !priority-age-assigner
            count: 4
            interval: 1.0
            bot-assignment-strategy: !assign-by-capacity
              sampling: !sampling-config
                sample-size: 8
                max-attempts: 3
                weights: !sampling-weights
                  priority: -10.0
                  locality: 5.0
                  capacity: 1.0
        pruner-job-max-age:
          days: 7
        property-set: !dynamic-property-set
          match-property-keys:
            - OSFamily
            - ISA
          wildcard-property-keys:
            - unixUID
            - unixGID
            - network
            - remoteApisSocketPath
            - chrootRootDigest
            - capability

    instances:
      - name: ''
        description: The unnamed lab instance.
        services:
          - !bots
            scheduler: *state-database

    thread-pool-size: 100
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller
  namespace: buildgrid
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app.kubernetes.io/part-of: lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: buildgrid-controller
  template:
    metadata:
      labels:
        app: buildgrid-controller
        buildgrid-scheduler-client: "true"
      annotations:
        buildgrid-config-revision: "2026-10-03-spread-assign"
    spec:
      automountServiceAccountToken: false
      priorityClassName: workflow-controller
      containers:
        - name: bgd
          image: 192.168.1.102:30500/buildgrid/buildgrid@sha256:9e34bf3745545686a52b368b62ed27fbfcde3522eaa6e2fd4c360e6f38e9f8db
          command: [bgd, server, start, -v, /etc/buildgrid/controller.yml]
          ports:
            - name: grpc
              containerPort: 50051
          readinessProbe:
            tcpSocket:
              port: grpc
            periodSeconds: 5
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
              ephemeral-storage: 256Mi
            limits:
              cpu: "8"
              memory: 8Gi
              ephemeral-storage: 2Gi
          volumeMounts:
            - name: config
              mountPath: /etc/buildgrid
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: buildgrid-config
---
apiVersion: v1
kind: Service
metadata:
  name: controller
  namespace: buildgrid
  labels:
    app.kubernetes.io/part-of: lab
spec:
  selector:
    app: buildgrid-controller
  ports:
    - name: grpc
      port: 50051
      targetPort: grpc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bots
  namespace: buildgrid
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app.kubernetes.io/part-of: lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: buildgrid-bots
  template:
    metadata:
      labels:
        app: buildgrid-bots
        buildgrid-scheduler-client: "true"
      annotations:
        buildgrid-config-revision: "2026-10-03-spread-assign"
    spec:
      automountServiceAccountToken: false
      priorityClassName: workflow-controller
      containers:
        - name: bgd
          image: 192.168.1.102:30500/buildgrid/buildgrid@sha256:9e34bf3745545686a52b368b62ed27fbfcde3522eaa6e2fd4c360e6f38e9f8db
          command: [bgd, server, start, -v, /etc/buildgrid/bots.yml]
          ports:
            - name: grpc
              containerPort: 50051
          readinessProbe:
            tcpSocket:
              port: grpc
            periodSeconds: 5
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
              ephemeral-storage: 256Mi
            limits:
              cpu: "2"
              memory: 2Gi
              ephemeral-storage: 2Gi
          volumeMounts:
            - name: config
              mountPath: /etc/buildgrid
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: buildgrid-config
---
apiVersion: v1
kind: Service
metadata:
  name: bots
  namespace: buildgrid
  labels:
    app.kubernetes.io/part-of: lab
spec:
  selector:
    app: buildgrid-bots
  ports:
    - name: grpc
      port: 50051
      targetPort: grpc
