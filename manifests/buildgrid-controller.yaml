# BuildGrid controller: REAPI Execution + Operations + Remote Workers (Bots).
#
# BuildStream sends every element build here as an Execute request; the
# scheduler queues it in Postgres and hands it to any connected
# buildbox-worker (buildgrid-worker DaemonSet). Workers are not pinned or
# enumerated: a new node gets a worker from the DaemonSet, the worker opens a
# bot session, and it starts draining the shared queue.
#
# CAS and the action cache stay in Buildbarn. The controller reads Actions from
# Buildbarn CAS and records ActionResults in Buildbarn AC through BuildGrid's
# remote proxies; clients and workers talk to Buildbarn directly for blobs.
#
# Platform matching: OSFamily/ISA must match the worker. BuildStream also sends
# unixUID/unixGID, network and remoteApisSocketPath, and GNOME's recc actions
# send chrootRootDigest. Those are per-action runner inputs that
# buildbox-run-bubblewrap implements, so they are accepted without constraining
# worker selection.
apiVersion: v1
kind: ConfigMap
metadata:
  name: buildgrid-config
  namespace: buildgrid
  labels:
    app.kubernetes.io/part-of: lab
data:
  controller.yml: |
    server:
      - !channel
        address: "[::]:50051"
        insecure-mode: true

    grpc-server-options:
      grpc.max_connection_age_ms: 300000

    description: >
      Lab BuildGrid controller: Execution/Operations/Bots, CAS and AC in Buildbarn.

    authorization:
      method: none

    monitoring:
      enabled: false

    connections:
      - !sql-connection &sql
        connection-string: postgresql://bgd@database.buildgrid.svc.cluster.local:5432/bgd
        pool-size: 10
        pool-timeout: 30
        max-overflow: 20

    storages:
      - !remote-storage &cas-storage
        url: http://frontend.buildbarn.svc.cluster.local:8980
        instance-name: ''

    caches:
      - !remote-action-cache &build-cache
        url: http://frontend.buildbarn.svc.cluster.local:8980
        instance-name: ''

    schedulers:
      - !sql-scheduler &state-database
        sql: *sql
        storage: *cas-storage
        action-cache: *build-cache
        # Large element builds (webkit, mozjs, llvm) run for hours.
        max-execution-timeout: 43200
        poll-interval: 0.5
        pruner-job-max-age:
          days: 7
        property-set: !dynamic-property-set
          match-property-keys:
            - OSFamily
            - ISA
          wildcard-property-keys:
            - unixUID
            - unixGID
            - network
            - remoteApisSocketPath
            - chrootRootDigest
            - capability

    instances:
      - name: ''
        description: The unnamed lab instance.
        services:
          - !execution
            scheduler: *state-database

    thread-pool-size: 100
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller
  namespace: buildgrid
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app.kubernetes.io/part-of: lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: buildgrid-controller
  template:
    metadata:
      labels:
        app: buildgrid-controller
      annotations:
        buildgrid-config-revision: "2026-10-03-initial"
    spec:
      automountServiceAccountToken: false
      priorityClassName: workflow-controller
      containers:
        - name: bgd
          image: 192.168.1.102:30500/buildgrid/buildgrid@sha256:9e34bf3745545686a52b368b62ed27fbfcde3522eaa6e2fd4c360e6f38e9f8db
          command: [bgd, server, start, -v, /etc/buildgrid/controller.yml]
          ports:
            - name: grpc
              containerPort: 50051
          readinessProbe:
            tcpSocket:
              port: grpc
            periodSeconds: 5
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
              ephemeral-storage: 256Mi
            limits:
              cpu: "4"
              memory: 4Gi
              ephemeral-storage: 2Gi
          volumeMounts:
            - name: config
              mountPath: /etc/buildgrid
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: buildgrid-config
---
apiVersion: v1
kind: Service
metadata:
  name: controller
  namespace: buildgrid
  labels:
    app.kubernetes.io/part-of: lab
spec:
  selector:
    app: buildgrid-controller
  ports:
    - name: grpc
      port: 50051
      targetPort: grpc
