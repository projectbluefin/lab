apiVersion: v1
kind: ConfigMap
metadata:
  name: buildstream-remote-cache
  namespace: argo
  labels:
    app.kubernetes.io/part-of: lab
    app.kubernetes.io/component: buildstream

data:
  # Element builds are BuildGrid actions; `builders` is how many the
  # coordinator keeps in flight. Each element action holds a worker slot while
  # its GNOME recc compiles run as separate actions, so every coordinator that
  # can run at once must together hold fewer element actions than the grid has
  # slots, or element actions occupy every slot and starve their own compiles.
  # Two bst-build lanes x two coordinators (Dakota variants, one per node) x 12
  # = 48 of 64 slots (2 x buildgrid-worker CONCURRENT_JOBS), leaving 16 for
  # compiles. Observed element-action concurrency in one lane peaked at 6.
  # Compile fan-out, not this value, is what spreads work across new nodes.
  #
  # `max-jobs` is the build parallelism inside one element action (make's
  # MAKEFLAGS, fdsdk's CARGO_BUILD_JOBS/GOMAXPROCS), so it caps a non-recc
  # element such as the kernel to that many of a node's 32 threads. Those
  # variables are environment-nocache, so the value does not reach cache keys
  # (`bst show` gives identical keys for every oci/bluefin.bst dependency at
  # 12 and 32); an element that writes %{max-jobs} into a command would.
  # Several big non-recc actions on one node share its 32 threads and the
  # worker's 56Gi memory limit. The bst build pod reads it only from here.
  dakota-buildstream.conf: |
    scheduler:
      network-retries: 8
      fetchers: 8
      builders: 12
      pushers: 4
    build:
      max-jobs: 32

    # Global, so it applies to every project including the gnome-build-meta
    # and freedesktop-sdk junctions (~900 of a Dakota build's ~1200 elements).
    # The index and storage are separate Buildbarn services: the frontend has
    # no Remote Asset service, so listing it as a combined server disables it
    # entirely ("Failed to initialize remote"), leaving junction elements with
    # no lab index to pull from and no push remote, and every run re-pulled
    # them from gbm.gnome.org over the WAN.
    artifacts:
      override-project-caches: false
      servers:
      - url: grpc://bb-remote-asset.buildbarn.svc.cluster.local:8984
        type: index
        push: true
      - url: grpc://frontend.buildbarn.svc.cluster.local:8980
        type: storage
        push: true
      - url: https://gbm.gnome.org:11003
        push: false
      - url: https://cache.freedesktop-sdk.io:11001
        push: false
    source-caches:
      # Do not inherit junction/project source-cache entries here: the
      # deployed bb-remote-asset endpoint cannot FetchBlob BuildStream URNs.
      # Explicit upstream fallbacks keep cold misses buildable without
      # sending source pushes to the incompatible endpoint.
      override-project-caches: true
      servers:
      - url: https://gbm.gnome.org:11003
        push: false
      - url: https://cache.freedesktop-sdk.io:11001
        push: false
    # buildbox-casd keeps its CAS in the Buildbarn frontend (the CAS the
    # BuildGrid workers use) instead of on the coordinator's disk. Pulling an
    # artifact then fetches only its proto and Directory protos, plus any file
    # blob the lab CAS lacks; remote build outputs are not downloaded back;
    # `bst artifact checkout` fetches file blobs on demand. The
    # remote-execution block below must not set its own storage-service:
    # BuildStream then downloads every build's outputs to the coordinator.
    cache:
      storage-service:
        url: grpc://frontend.buildbarn.svc.cluster.local:8980
        connection-config:
          keepalive-time: 60
          retry-limit: 8
          retry-delay: 1000
          request-timeout: 1800
  # Per-project remote-execution snippet body. Pipelines append this under
  # projects.<name> (indented). Execution goes to BuildGrid (bubblewrap
  # workers); the action cache stays in Buildbarn, and the CAS is the
  # `cache.storage-service` above, which the BuildGrid controller and workers
  # use as their CAS too.
  remote-execution.conf: |
    remote-execution:
      execution-service:
        url: http://controller.buildgrid.svc.cluster.local:50051
        connection-config:
          keepalive-time: 60
          retry-limit: 8
          retry-delay: 1000
      action-cache-service:
        url: grpc://frontend.buildbarn.svc.cluster.local:8980
        push: true
        connection-config:
          keepalive-time: 60
          retry-limit: 8
          retry-delay: 1000
          request-timeout: 1800
