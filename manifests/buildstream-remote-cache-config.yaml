apiVersion: v1
kind: ConfigMap
metadata:
  name: buildstream-remote-cache
  namespace: argo
  labels:
    app.kubernetes.io/part-of: lab
    app.kubernetes.io/component: buildstream

data:
  # Dakota's coordinator fetches four artifacts/sources concurrently. Use a
  # moderate profile that still leaves headroom for BuildBarn queue depth and
  # worker action pressure while avoiding the earlier over-saturation.
  dakota-buildstream.conf: |
    scheduler:
      network-retries: 8
      fetchers: 8
      builders: 4
      pushers: 4
    build:
      max-jobs: 12

    artifacts:
      override-project-caches: false
      servers:
      - url: grpc://frontend.buildbarn.svc.cluster.local:8980
        push: true
      - url: https://gbm.gnome.org:11003
        push: false
      - url: https://cache.freedesktop-sdk.io:11001
        push: false
    source-caches:
      # Do not inherit junction/project source-cache entries here: the
      # deployed bb-remote-asset endpoint cannot FetchBlob BuildStream URNs.
      # Explicit upstream fallbacks keep cold misses buildable without
      # sending source pushes to the incompatible endpoint.
      override-project-caches: true
      servers:
      - url: https://gbm.gnome.org:11003
        push: false
      - url: https://cache.freedesktop-sdk.io:11001
        push: false
  # Per-project remote-execution snippet body. Pipelines append this under
  # projects.<name> (indented) when distributed builds are enabled.
  remote-execution.conf: |
    remote-execution:
      execution-service:
        url: grpc://frontend.buildbarn.svc.cluster.local:8980
        connection-config:
          keepalive-time: 60
          retry-limit: 8
          retry-delay: 1000
          request-timeout: 1800
      storage-service:
        url: grpc://frontend.buildbarn.svc.cluster.local:8980
        connection-config:
          keepalive-time: 60
          retry-limit: 8
          retry-delay: 1000
          request-timeout: 1800
      action-cache-service:
        url: grpc://frontend.buildbarn.svc.cluster.local:8980
        push: true
        connection-config:
          keepalive-time: 60
          retry-limit: 8
          retry-delay: 1000
          request-timeout: 1800
