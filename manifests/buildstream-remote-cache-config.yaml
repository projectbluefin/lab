apiVersion: v1
kind: ConfigMap
metadata:
  name: buildstream-remote-cache
  namespace: argo
  labels:
    app.kubernetes.io/part-of: lab
    app.kubernetes.io/component: buildstream

data:
  # Element builds are BuildGrid actions queued cluster-wide; `builders` is how
  # many the coordinator keeps in flight. Keep it above the total worker slot
  # count (buildgrid-worker CONCURRENT_JOBS x nodes) so a newly added node gets
  # work immediately instead of waiting for this value to change.
  dakota-buildstream.conf: |
    scheduler:
      network-retries: 8
      fetchers: 8
      builders: 32
      pushers: 4
    build:
      max-jobs: 12

    artifacts:
      override-project-caches: false
      servers:
      - url: grpc://frontend.buildbarn.svc.cluster.local:8980
        push: true
      - url: https://gbm.gnome.org:11003
        push: false
      - url: https://cache.freedesktop-sdk.io:11001
        push: false
    source-caches:
      # Do not inherit junction/project source-cache entries here: the
      # deployed bb-remote-asset endpoint cannot FetchBlob BuildStream URNs.
      # Explicit upstream fallbacks keep cold misses buildable without
      # sending source pushes to the incompatible endpoint.
      override-project-caches: true
      servers:
      - url: https://gbm.gnome.org:11003
        push: false
      - url: https://cache.freedesktop-sdk.io:11001
        push: false
  # Per-project remote-execution snippet body. Pipelines append this under
  # projects.<name> (indented). Execution goes to BuildGrid (bubblewrap
  # workers); CAS and the action cache stay in Buildbarn, which the BuildGrid
  # controller and workers use as their CAS too.
  remote-execution.conf: |
    remote-execution:
      execution-service:
        url: http://controller.buildgrid.svc.cluster.local:50051
        connection-config:
          keepalive-time: 60
          retry-limit: 8
          retry-delay: 1000
      storage-service:
        url: grpc://frontend.buildbarn.svc.cluster.local:8980
        connection-config:
          keepalive-time: 60
          retry-limit: 8
          retry-delay: 1000
          request-timeout: 1800
      action-cache-service:
        url: grpc://frontend.buildbarn.svc.cluster.local:8980
        push: true
        connection-config:
          keepalive-time: 60
          retry-limit: 8
          retry-delay: 1000
          request-timeout: 1800
