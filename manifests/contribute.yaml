# hive-contribute: projectbluefin/contribute (OMP in tmux) on the local llm-d models.
# StatefulSet, replicas: 0 in git; `just contribute-on` (in ~/.justfile) writes the Secret (your `gh auth token`,
# Hive registration, OMP config.yml) and scales it to 1. Ornith on exo-0 implements;
# Ornith on ghost advises. See docs/skills/hive-contribute/SKILL.md.
# Files are copied into an emptyDir home by seed-home: subPath mounts would make
# ~/.omp root-owned, and OMP must write ~/.omp/natives.
apiVersion: v1
kind: Namespace
metadata:
  name: contribute
  labels:
    app.kubernetes.io/part-of: testing-lab
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: contribute-omp
  namespace: contribute
data:
  models.yml: |
    providers:
      lab-worker:
        baseUrl: http://llm-d-exo-0.llm-d.svc.cluster.local:8000/v1
        api: openai-completions
        apiKey: local
        models:
        - id: ornith
          name: Ornith 1.5 35B-A3B Q6_K
          contextWindow: 102400
      lab-advisor:
        baseUrl: http://llm-d-ghost.llm-d.svc.cluster.local:8000/v1
        api: openai-completions
        apiKey: local
        models:
        - id: ornith
          name: Ornith 1.5 35B-A3B Q6_K
          contextWindow: 102400
  roles.yml: |
    # Layered last: pinned local models for worker roles and priority advisor settings
    modelRoles:
      default: lab-worker/ornith
      smol: lab-worker/ornith
    advisor:
      syncBacklog: "off"
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: contribute
  namespace: contribute
  labels:
    app.kubernetes.io/name: contribute
spec:
  replicas: 0
  serviceName: contribute
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: contribute
  template:
    metadata:
      labels:
        app.kubernetes.io/name: contribute
    spec:
      securityContext:
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      containers:
      - name: contribute
        image: ghcr.io/projectbluefin/contribute:stable
        imagePullPolicy: Always
        env:
        - name: AGENT_BACKEND
          value: omp
        - name: HOME
          value: /home/hive
        - name: TERM
          value: xterm-256color
        - name: COLORTERM
          value: truecolor
        - name: PI_CONFIG_FILES
          value: /usr/share/hive/contribute/omp-config.yml:/etc/contribute/roles.yml
        - name: HIVE_SESSION
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: GH_TOKEN
          valueFrom:
            secretKeyRef:
              name: contribute
              key: GH_TOKEN
        volumeMounts:
        - name: home
          mountPath: /home/hive
        - name: tmp
          mountPath: /tmp
        - name: omp
          mountPath: /etc/contribute
          readOnly: true
        resources:
          requests:
            cpu: '1'
            memory: 2Gi
          limits:
            cpu: '8'
            memory: 16Gi
      volumes:
      - name: home
        emptyDir:
          sizeLimit: 50Gi
      - name: tmp
        emptyDir: {}
      - name: secret
        secret:
          secretName: contribute
          defaultMode: 288
      - name: omp
        configMap:
          name: contribute-omp
      initContainers:
      - name: seed-home
        image: ghcr.io/projectbluefin/contribute:stable
        imagePullPolicy: Always
        command:
        - bash
        - -c
        - |
          set -euo pipefail
          mkdir -p ~/.omp/agent ~/.config/hive
          [ -d ~/workspace ] && [ ! -O ~/workspace ] && rm -rf ~/workspace || true
          mkdir -p ~/workspace
          chmod 755 ~/workspace
          install -m600 /seed/secret/config.yml ~/.omp/agent/config.yml
          install -m600 /seed/omp/models.yml ~/.omp/agent/models.yml
          install -m600 /seed/secret/contributor.env ~/.config/hive/contributor.env
          tar -xzf /seed/secret/ghost-context.tgz -C ~/.omp/agent
          ln -sfn "$HOME/agent.md" ~/.omp/agent/AGENTS.md
        env:
        - name: HOME
          value: /home/hive
        volumeMounts:
        - name: home
          mountPath: /home/hive
        - name: secret
          mountPath: /seed/secret
          readOnly: true
        - name: omp
          mountPath: /seed/omp
          readOnly: true
