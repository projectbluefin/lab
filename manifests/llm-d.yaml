          httpGet:
            path: /health
            port: 8000
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 5
      volumes:
      - name: model-cache
        persistentVolumeClaim:
          claimName: llm-d-advisor-cache
      - name: dev-dri
        hostPath:
          path: /dev/dri
          type: Directory
      - name: presets
        configMap:
          name: llm-d-presets
      initContainers:
      - name: fetch-mtp-draft
        image: ghcr.io/ggml-org/llama.cpp:server-vulkan-b11151
        command:
        - sh
