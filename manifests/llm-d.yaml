apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: llm-d-preempt
value: 1000000
preemptionPolicy: PreemptLowerPriority
globalDefault: false
description: "Higher scheduling priority for local LLM inference so it can preempt lower-priority work when needed."
---
apiVersion: v1
kind: Namespace
metadata:
  name: llm-d
  labels:
    app.kubernetes.io/part-of: testing-lab
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: baseline
    pod-security.kubernetes.io/audit: baseline
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: llm-d-model-cache
  namespace: llm-d
  labels:
    app.kubernetes.io/name: llm-d-modelserver
    app.kubernetes.io/part-of: testing-lab
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 100Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-d-modelserver
  namespace: llm-d
  labels:
    app.kubernetes.io/name: llm-d-modelserver
    app.kubernetes.io/part-of: testing-lab
spec:
  # Pause with replicas: 0 here, not kubectl scale (selfHeal reverts it); safe only once the PVC is Bound.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: llm-d-modelserver
  # Recreate: one amd.com/gpu and an RWO PVC deadlock a rolling update.
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: llm-d-modelserver
      annotations:
        lab.projectbluefin.io/config-version: llamacpp-vulkan-v1
    spec:
      priorityClassName: llm-d-preempt
      nodeSelector:
        kubernetes.io/hostname: exo-0
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 0
      containers:
        - name: modelserver
          # Immutable per-build tag, not a digest (zot sync needs a tag); never the floating :server-vulkan.
          image: ghcr.io/ggml-org/llama.cpp:server-vulkan-b10290
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
          args:
            - --hf-repo
            - unsloth/Qwen3-30B-A3B-Instruct-2507-GGUF:Q6_K
            - --alias
            - local-llm
            - --port
            - "8000"
            - -ngl
            - "999"
            - -fa
            - "on"
            - --load-mode
            - none
            - --cache-type-k
            - q8_0
            - --cache-type-v
            - q8_0
            - --ctx-size
            - "65536"
            - --batch-size
            - "4096"
            - --ubatch-size
            - "512"
            - --threads
            - "12"
            - --parallel
            - "1"
            - --cache-reuse
            - "256"
            - --temp
            - "0.7"
            - --top-p
            - "0.8"
            - --top-k
            - "20"
            - --min-p
            - "0.0"
          env:
            - name: LLAMA_CACHE
              value: /models
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          volumeMounts:
            - name: model-cache
              mountPath: /models
            - name: dev-dri
              mountPath: /dev/dri
          resources:
            requests:
              cpu: "4"
              memory: 34Gi
              amd.com/gpu: "1"
            limits:
              cpu: "12"
              memory: 44Gi
              amd.com/gpu: "1"
          # Generous startup budget: the first start downloads ~25 GB; too short restarts the download.
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 120
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: llm-d-model-cache
        - name: dev-dri
          hostPath:
            path: /dev/dri
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: llm-d-modelserver
  namespace: llm-d
  labels:
    app.kubernetes.io/name: llm-d-modelserver
    app.kubernetes.io/part-of: testing-lab
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: llm-d-modelserver
  ports:
    - name: http
      port: 8000
      targetPort: http
      nodePort: 30800
      protocol: TCP
