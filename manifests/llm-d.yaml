# Local LLM inference for hive-contribute (docs/skills/hive-contribute/SKILL.md).
# worker (Ornith 35B-A3B Q6_K) on exo-0 and advisor (Qwen3.8 27B UD-Q6_K) on ghost, one GPU each.
# Keep replicas: 1 here so each WaitForFirstConsumer PVC binds on first sync; toggle with
# `just contribute-on/off` (replicas are ignored by testing-lab-infra).
# Recreate: one amd.com/gpu and an RWO PVC deadlock a rolling update.
# The advisor's MTP draft is fetched by an init container: -hfd <repo>:Q4_0 picks the full 16 GB Q4_0 model.
# Image: immutable per-build tag (zot syncs tags only); never the floating :server-vulkan.
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: llm-d-preempt
value: 1000000
preemptionPolicy: PreemptLowerPriority
globalDefault: false
description: Higher scheduling priority for local LLM inference so it can preempt lower-priority work when needed.
---
apiVersion: v1
kind: Namespace
metadata:
  name: llm-d
  labels:
    app.kubernetes.io/part-of: testing-lab
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: baseline
    pod-security.kubernetes.io/audit: baseline
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: llm-d-model-cache
  namespace: llm-d
  labels:
    app.kubernetes.io/name: llm-d-modelserver
    app.kubernetes.io/part-of: testing-lab
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 100Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-d-modelserver
  namespace: llm-d
  labels:
    app.kubernetes.io/name: llm-d-modelserver
    app.kubernetes.io/part-of: testing-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: llm-d-modelserver
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: llm-d-modelserver
    spec:
      priorityClassName: llm-d-preempt
      nodeSelector:
        kubernetes.io/hostname: exo-0
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 0
      containers:
      - name: modelserver
        image: ghcr.io/ggml-org/llama.cpp:server-vulkan-b11151
        imagePullPolicy: IfNotPresent
        securityContext:
          privileged: false
          allowPrivilegeEscalation: false
        args:
        - --hf-repo
        - ornith-ai/Ornith-1.5-35B-A3B-GGUF
        - --hf-file
        - Ornith-1.5-35B-Q6_K.gguf
        - --no-mmproj
        - --alias
        - ornith
        - --ctx-size
        - '102400'
        - --cache-ram
        - '512'
        - --reasoning-budget
        - '3600'
        - --reasoning-budget-message
        - ' OK, I''ve thought long enough. Either ask the advisor for advice, or answer.'
        - --temp
        - '0.6'
        - -b
        - '1024'
        - -ub
        - '1024'
        - --port
        - '8000'
        - -ngl
        - '999'
        - -fa
        - 'on'
        - --load-mode
        - none
        - --parallel
        - '1'
        - --threads
        - '12'
        env:
        - name: LLAMA_CACHE
          value: /models
        ports:
        - name: http
          containerPort: 8000
          protocol: TCP
        volumeMounts:
        - name: model-cache
          mountPath: /models
        - name: dev-dri
          mountPath: /dev/dri
        resources:
          requests:
            cpu: '4'
            memory: 40Gi
            amd.com/gpu: '1'
          limits:
            cpu: '12'
            memory: 52Gi
            amd.com/gpu: '1'
        startupProbe:
          httpGet:
            path: /health
            port: 8000
          periodSeconds: 60
          timeoutSeconds: 10
          failureThreshold: 180
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 5
      volumes:
      - name: model-cache
        persistentVolumeClaim:
          claimName: llm-d-model-cache
      - name: dev-dri
        hostPath:
          path: /dev/dri
          type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: llm-d-modelserver
  namespace: llm-d
  labels:
    app.kubernetes.io/name: llm-d-modelserver
    app.kubernetes.io/part-of: testing-lab
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: llm-d-modelserver
  ports:
  - name: http
    port: 8000
    targetPort: http
    nodePort: 30800
    protocol: TCP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: llm-d-advisor-cache
  namespace: llm-d
  labels:
    app.kubernetes.io/name: llm-d-advisor
    app.kubernetes.io/part-of: testing-lab
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 80Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-d-advisor
  namespace: llm-d
  labels:
    app.kubernetes.io/name: llm-d-advisor
    app.kubernetes.io/part-of: testing-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: llm-d-advisor
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: llm-d-advisor
    spec:
      priorityClassName: llm-d-preempt
      nodeSelector:
        kubernetes.io/hostname: ghost
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 0
      containers:
      - name: modelserver
        image: ghcr.io/ggml-org/llama.cpp:server-vulkan-b11151
        imagePullPolicy: IfNotPresent
        securityContext:
          privileged: false
          allowPrivilegeEscalation: false
        args:
        - --hf-repo
        - unsloth/Qwen3.8-27B-GGUF
        - --hf-file
        - Qwen3.8-27B-UD-Q6_K.gguf
        - --no-mmproj
        - --alias
        - qwen-advisor
        - --ctx-size
        - '65536'
        - --cache-ram
        - '256'
        - --reasoning-budget
        - '4000'
        - --reasoning-budget-message
        - OK, I've thought long enough. Let's answer.
        - --spec-type
        - draft-mtp
        - --spec-draft-model
        - /models/mtp/mtp-Qwen3.8-27B-Q4_0.gguf
        - --spec-draft-n-max
        - '4'
        - --spec-draft-ngl
        - '999'
        - --temp
        - '0.6'
        - -b
        - '256'
        - -ub
        - '256'
        - --port
        - '8000'
        - -ngl
        - '999'
        - -fa
        - 'on'
        - --load-mode
        - none
        - --parallel
        - '1'
        - --threads
        - '12'
        env:
        - name: LLAMA_CACHE
          value: /models
        ports:
        - name: http
          containerPort: 8000
          protocol: TCP
        volumeMounts:
        - name: model-cache
          mountPath: /models
        - name: dev-dri
          mountPath: /dev/dri
        resources:
          requests:
            cpu: '4'
            memory: 32Gi
            amd.com/gpu: '1'
          limits:
            cpu: '12'
            memory: 44Gi
            amd.com/gpu: '1'
        startupProbe:
          httpGet:
            path: /health
            port: 8000
          periodSeconds: 60
          timeoutSeconds: 10
          failureThreshold: 180
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 5
      volumes:
      - name: model-cache
        persistentVolumeClaim:
          claimName: llm-d-advisor-cache
      - name: dev-dri
        hostPath:
          path: /dev/dri
          type: Directory
      initContainers:
      - name: fetch-mtp-draft
        image: cgr.dev/chainguard/wolfi-base@sha256:02dab76bd852a70556b5b2002195c8a5fdab77d323c433bf6642aab080489795
        command:
        - sh
        - -c
        - f=/models/mtp/mtp-Qwen3.8-27B-Q4_0.gguf; test -s $f || { mkdir -p /models/mtp && wget -q -O $f.tmp https://huggingface.co/unsloth/Qwen3.8-27B-GGUF/resolve/main/MTP/mtp-Qwen3.8-27B-Q4_0.gguf &&
          mv $f.tmp $f; }
        volumeMounts:
        - name: model-cache
          mountPath: /models
---
apiVersion: v1
kind: Service
metadata:
  name: llm-d-advisor
  namespace: llm-d
  labels:
    app.kubernetes.io/name: llm-d-advisor
    app.kubernetes.io/part-of: testing-lab
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: llm-d-advisor
  ports:
  - name: http
    port: 8000
    targetPort: http
    nodePort: 30801
    protocol: TCP
