        args:
        - --models-preset
        - /etc/llm-d/presets.ini
        - --models-max
        - '1'
        - --port
        - '8000'
        env:
        - name: LLAMA_CACHE
          value: /models
        ports:
        - name: http
          containerPort: 8000
          protocol: TCP
        volumeMounts:
        - name: model-cache
          mountPath: /models
        - name: dev-dri
          mountPath: /dev/dri
        - name: presets
          mountPath: /etc/llm-d
          readOnly: true
        resources:
          requests:
            cpu: '4'
            memory: 40Gi
            amd.com/gpu: '1'
          limits:
            cpu: '12'
            memory: 52Gi
            amd.com/gpu: '1'
        startupProbe:
          httpGet:
            path: /health
