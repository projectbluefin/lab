        - f=/models/mtp/mtp-Qwen3.8-27B-Q4_0.gguf; test -s $f || { mkdir -p /models/mtp && curl -fsSL -o $f.tmp https://huggingface.co/unsloth/Qwen3.8-27B-GGUF/resolve/main/MTP/mtp-Qwen3.8-27B-Q4_0.gguf
          && mv $f.tmp $f; }
        volumeMounts:
        - name: model-cache
          mountPath: /models
---
apiVersion: v1
kind: Service
metadata:
  name: llm-d-ghost
  namespace: llm-d
  labels:
    app.kubernetes.io/name: llm-d
    app.kubernetes.io/instance: ghost
    app.kubernetes.io/part-of: testing-lab
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: llm-d
    app.kubernetes.io/instance: ghost
  ports:
  - name: http
    port: 8000
    targetPort: http
    nodePort: 30801
    protocol: TCP
