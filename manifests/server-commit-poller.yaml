# Bluefin Server lab gate: builds the image set with dev keys
# (bluefin-server-build-pipeline) on each new commit and records the SHA when
# it builds. The installer boot test is re-chained once projectbluefin/server#265
# gives the offline USB installer an unattended path that works under KubeVirt.
apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: server-commit-poller
  namespace: argo
  labels:
    app.kubernetes.io/component: commit-poller
    app.kubernetes.io/part-of: bluefin-test-suite
spec:
  # Offset from the dakota poller so the two share bounded BST admission
  # rather than contending for the same slot.
  schedules:
    - "2-59/15 * * * *"
  timezone: "UTC"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 60
  workflowMetadata:
    labels:
      bluefin.io/bst-workload: "true"
      bluefin.io/bst-source: bluefin-server
  workflowSpec:
    serviceAccountName: argo
    entrypoint: poll-bluefin-server
    arguments:
      parameters:
        - name: repo
          value: projectbluefin/server
        - name: branch
          value: main
        - name: state-key
          value: sha-bluefin-server-main
        - name: force
          value: "false"
    workflowTemplateRef:
      name: bst-commit-poller
