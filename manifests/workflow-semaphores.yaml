# Cluster-wide Argo workflow queuing.
#
# Template-level semaphores are the only lock type that binds across ALL
# callers, including workflow-of-workflows invocations via templateRef.
#
# Keys:
#   bst-build          — Global Dakota/Bluefin Server BuildStream
#                        execution lanes: how many pipelines share the
#                        BuildGrid at once; variants still run in parallel
#                        inside each. Two lanes, sized by:
#                        - Controller Execute RPCs (maximum-concurrent-rpcs
#                          6000): recc releases its make/ninja jobserver token
#                          while it waits on remote execution, so an element's
#                          compiles are bounded by its ready compile steps, not
#                          by max-jobs. One lane peaked at 885 in flight at
#                          max-jobs 12 (gtk alone submitted 1531). Replaying
#                          that load at max-jobs 32 gives ~1290 for one lane and
#                          2750-3700 for two; an Execute rejected at the limit
#                          fails the compile (recc does not retry
#                          RESOURCE_EXHAUSTED).
#                        - argo-quota limits.cpu 128: a coordinator pod is
#                          20.5 CPU of limits (main 4 + publish 16 + init 0.5)
#                          and a Dakota pipeline runs two at once (one per
#                          node), so 2 lanes = 82 CPU; 3 lanes = 123 leaves
#                          no room for QA pods.
#                        - Worker slots (2 x 32): element actions hold a slot
#                          while their recc compiles run, so lanes x 2
#                          coordinators x `builders` (12, see
#                          buildstream-remote-cache-config.yaml) must stay
#                          below 64; two lanes = 48.
#                        bst-commit-poller reads this value and admits
#                        lanes + 1 bst-workload workflows (one waits).
#                        bst-cache-warm runs on top of these lanes and adds
#                        its own Execute RPCs (up to ~1500): two busy lanes plus
#                        a warmup stays under 6000.
#   bst-cache-warm     — Dedicated lane for the bst-cache-warm recovery chain.
#                        Keeps cache re-seeding from occupying the production
#                        bst-build slot while still allowing only one warmup
#                        build at a time.
#   ghost-container-qa — Cross-workflow capacity limit for the control-plane
#                        container QA runner (run-container-tests). Each pod
#                        requests 4Gi on ghost; cap concurrent runs to keep
#                        total requested memory below the 95% pressure threshold.
#                        Lowered from 8 to 6 to relieve memory pressure on ghost
#                        while preserving enough parallelism for the suite fan-out.
#                        Topology rule: this key is declared ONLY on the
#                        run-container-tests template (the leaf that consumes the
#                        runner). No orchestration template and no
#                        spec.synchronization may reference it, and every
#                        fan-out template that calls it must carry its own
#                        template-level `parallelism` — spec.parallelism is not
#                        inherited through templateRef. Enforced by
#                        tests/unit/test_semaphore_topology.py.
#                        VMs are still scheduled natively and must not use this
#                        semaphore (see docs/skills/argo-workflows/patterns.md).
#   dakota-vm-boot     — Serializes Dakota VM boot test pods on the cluster.
#                        Each pod runs QEMU/KVM with 6-8 CPUs and 12-14Gi RAM
#                        and performs plain-root disk unpack. One slot keeps
#                        host resources bounded without contending for memory
#                        or KVM acceleration.
apiVersion: v1
kind: ConfigMap
metadata:
  name: workflow-semaphores
  namespace: argo
  labels:
    app.kubernetes.io/part-of: lab
data:
  bst-build: "2"
  bst-cache-warm: "1"
  ghost-container-qa: "6"
  dakota-vm-boot: "1"
